<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League | Live Timing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#0b0b0d; --panel:#15151e; --line:#2a2a38; --red:#e10600; --green:#00ff9c; --text:#ffffff; --muted:#9a9aa5;
}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);}
header{height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:#000; border-bottom:2px solid var(--red);}
.brand{font-weight:900; letter-spacing:3px;}
.brand span{color:var(--red);}
nav{display:flex;gap:16px;}
nav button{background:none; border:none; color:#ccc; font-weight:700; cursor:pointer;}
nav button.active{color:white; border-bottom:3px solid var(--red);}
.admin{font-size:11px; color:var(--muted);}
.section{display:none;padding:20px;}
.section.active{display:block;}
.session-bar{margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;}
.session-bar div{font-weight:700; font-size:16px;}
.session-bar .session-name{font-size:18px;}
.leader{display:grid; grid-template-columns:80px 1fr 160px; align-items:center; background:linear-gradient(90deg,#000,#14141c); border-left:6px solid var(--red); padding:18px; margin-bottom:18px;}
.pos{font-size:48px;font-weight:900;text-align:center;}
.driver h1{margin:0;font-size:22px;}
.driver small{color:var(--muted);}
.stats{display:flex;gap:8px;margin-top:6px;}
.stats span{background:#1e1e28;padding:4px 8px;font-size:11px;}
.delta{text-align:right;}
.delta strong{font-size:22px;color:var(--green);}
.grid{display:grid;grid-template-columns:1fr 360px;gap:18px;}
.panel{background:var(--panel);border:1px solid var(--line);}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid var(--line);font-size:14px;}
th{color:var(--muted);font-size:12px;}
.lead{background:#1a1a24;}
.weather{background:var(--panel);border:1px solid var(--line);padding:12px;margin-bottom:12px;}
.weather-title{font-size:11px;color:var(--muted);margin-bottom:8px;}
.weather-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;}
.weather-box{background:#1a1a24;padding:10px;}
.weather-box strong{display:block;font-size:18px;}
.weather-box small{font-size:11px;color:var(--muted);}
.track{background:var(--panel);border:1px solid var(--line);padding:12px;}
.track-title{font-size:11px;color:var(--muted);margin-bottom:6px;}
.track svg{width:100%;height:240px;}
.track path{fill:none;stroke:#3a3a4d;stroke-width:20;stroke-linecap:round;}
.ideal{stroke:var(--red);stroke-width:6;stroke-dasharray:14 18;animation:dash 6s linear infinite;}
.car{fill:white;}
input{width:100%;padding:10px;margin-bottom:10px;background:#101018;border:1px solid var(--line);color:white;}
button.primary{background:var(--red);border:none;padding:10px;width:100%;font-weight:800;color:white;cursor:pointer;}
button.danger{background:#a00000;border:none;padding:4px 8px;color:white;cursor:pointer;}
.hidden{display:none;}
footer{text-align:center;font-size:11px;color:var(--muted);padding:6px;}
</style>
</head>
<body>
<header>
  <div class="brand">ROOKIE <span>LEAGUE</span></div>
  <nav>
    <button class="active" onclick="show('live',this)">LIVE</button>
    <button onclick="show('champ',this)">CAMPEONATO</button>
    <button onclick="show('signup',this)">INSCRIÇÃO</button>
    <button onclick="show('login',this)">ADM</button>
  </nav>
  <div class="admin" id="adminStatus">Público</div>
</header>

<!-- LIVE -->
<div id="live" class="section active">
  <div class="session-bar">
    <div class="session-name">Sessão: <span id="sessionName">Treino Livre</span></div>
    <div>Volta: <span id="lapNumber">1</span></div>
  </div>

  <div class="leader">
    <div class="pos">P1</div>
    <div class="driver">
      <h1>#27 João Silva</h1>
      <small>BMW M4 GT3 • 1:32.451</small>
      <div class="stats"><span>MED</span><span>Fuel 42%</span><span>ERS 78%</span></div>
    </div>
    <div class="delta"><small>GAP</small><strong>+0.000</strong></div>
  </div>

  <div class="grid">
    <div class="panel">
      <table>
        <thead>
          <tr><th>POS</th><th>PILOTO</th><th>VOLTA</th><th>Δ</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div>
      <div class="weather">
        <div class="weather-title">CLIMA</div>
        <div class="weather-grid">
          <div class="weather-box">☀️<strong>Sunny</strong><small>Clima</small></div>
          <div class="weather-box"><strong>26°C</strong><small>Ar</small></div>
          <div class="weather-box"><strong>38°C</strong><small>Pista</small></div>
        </div>
      </div>

      <div class="track">
        <div class="track-title">TRACK MAP</div>
        <svg viewBox="0 0 600 320">
          <path id="trackPath" d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160" fill="none" stroke="#3a3a4d" stroke-width="20" stroke-linecap="round"/>
          <path class="ideal" d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
        </svg>
      </div>
    </div>
  </div>
</div>

<!-- CAMPEONATO -->
<div id="champ" class="section">
  <div class="panel">
    <table>
      <thead>
        <tr><th>POS</th><th>PILOTO</th><th>PTS</th><th class="admin-only hidden">AÇÕES</th></tr>
      </thead>
      <tbody id="champTable"></tbody>
    </table>
    <div class="admin-only hidden" style="padding:12px">
      <input id="cName" placeholder="Piloto">
      <input id="cPts" placeholder="Pontos">
      <button class="primary" onclick="addChamp()">Adicionar</button>
    </div>
  </div>
</div>

<!-- INSCRIÇÃO -->
<div id="signup" class="section">
  <div class="panel" style="padding:16px">
    <input placeholder="Nome do Piloto">
    <input placeholder="Carro">
    <button class="primary">Enviar</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="section">
  <div class="panel" style="padding:16px">
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button class="primary" onclick="login()">Entrar</button>
  </div>
</div>

<footer>Rookie League • Live Timing</footer>

<script>
// NAV
function show(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

// LOGIN
let isAdmin=false;
async function login(){
  const res=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:user.value,pass:pass.value})});
  const data=await res.json();
  if(data.success){
    isAdmin=true;
    adminStatus.innerText="Administrador";
    document.querySelectorAll(".admin-only").forEach(e=>e.classList.remove("hidden"));
    alert("Login ADM realizado");
  }else alert("Login inválido");
}

// CAMPEONATO
async function addChamp(){
  if(!isAdmin) return;
  const name=cName.value;
  const pts=Number(cPts.value);
  await fetch("/api/championship",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,pts})});
  cName.value=""; cPts.value="";
}

// TRACK MAP
const svg=document.querySelector(".track svg");
const trackPath=document.getElementById("trackPath");
let cars=[];
const NUM_CARS=5;
for(let i=0;i<NUM_CARS;i++){
  let c=document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("r",7); c.setAttribute("fill","white"); svg.appendChild(c);
  cars.push({circle:c, progress:i*0.1});
}
function getPointAt(progress){
  let pathLength=trackPath.getTotalLength();
  let point=trackPath.getPointAtLength(progress*pathLength);
  return {x:point.x,y:point.y};
}

// UPDATE SERVER STATE
async function updateServerState(){
  const res=await fetch("/api/state");
  const data=await res.json();
  document.getElementById("sessionName").innerText=data.session;
  document.getElementById("lapNumber").innerText=Math.floor(data.lap);

  // Atualiza leaderboard
  const tb=document.querySelector("#live table tbody");
  tb.innerHTML="";
  data.championship.forEach((p,i)=>{
    tb.innerHTML+=`<tr${i===0?" class='lead'":""}><td>P${i+1}</td><td>${p.name}</td><td>--</td><td>--</td></tr>`;
  });

  // Atualiza carros no mapa
  data.cars.forEach((c,i)=>{
    if(cars[i]){
      cars[i].progress=c.progress;
      let pos=getPointAt(cars[i].progress);
      cars[i].circle.setAttribute("cx",pos.x);
      cars[i].circle.setAttribute("cy",pos.y);
    }
  });
}
setInterval(updateServerState,200);
</script>

</body>
</html>
