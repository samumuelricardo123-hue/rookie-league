<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Dashboard RPM LEDs</title>
<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.dashboard {
    display: grid;
    grid-template-areas:
        "rpm rpm"
        "speed speed"
        "systems systems";
    grid-gap: 30px;
    text-align: center;
}

/* RPM LEDs */
.rpm-container {
    grid-area: rpm;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    width: 300px;
}
.led-rpm {
    width: 20px;
    height: 20px;
    margin: 4px;
    background: #222;
    border-radius: 4px;
    transition: background 0.1s;
}
.led-rpm.on {
    background: red;
    box-shadow: 0 0 10px red;
}

/* Speed */
.speed-container h1 {
    grid-area: speed;
    font-size: 4em;
    color: #0ff;
}

/* DRS LED */
.drs {
    width: 60px;
    height: 30px;
    background: #333;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    transition: background 0.2s;
}
.drs.on {
    background: #ff0;
    color: #000;
}

/* ERS barra */
.ers-container {
    width: 200px;
    height: 20px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}
.ers-bar {
    height: 100%;
    width: 0%;
    background: #0f0;
    transition: width 0.2s;
}

/* Systems container */
.systems {
    grid-area: systems;
    display: flex;
    justify-content: center;
    gap: 50px;
    align-items: center;
    font-size: 1.2em;
}

/* Botão fullscreen */
.fullscreen-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #222;
    color: #fff;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
}
</style>
</head>
<body>

<button class="fullscreen-btn" id="fullscreen-btn">Tela Cheia</button>

<div class="dashboard" id="dashboard">

  <!-- RPM LEDs -->
  <div class="rpm-container" id="rpm-container">
    <!-- 20 LEDs de RPM -->
    <div class="led-rpm" id="led0"></div>
    <div class="led-rpm" id="led1"></div>
    <div class="led-rpm" id="led2"></div>
    <div class="led-rpm" id="led3"></div>
    <div class="led-rpm" id="led4"></div>
    <div class="led-rpm" id="led5"></div>
    <div class="led-rpm" id="led6"></div>
    <div class="led-rpm" id="led7"></div>
    <div class="led-rpm" id="led8"></div>
    <div class="led-rpm" id="led9"></div>
    <div class="led-rpm" id="led10"></div>
    <div class="led-rpm" id="led11"></div>
    <div class="led-rpm" id="led12"></div>
    <div class="led-rpm" id="led13"></div>
    <div class="led-rpm" id="led14"></div>
    <div class="led-rpm" id="led15"></div>
    <div class="led-rpm" id="led16"></div>
    <div class="led-rpm" id="led17"></div>
    <div class="led-rpm" id="led18"></div>
    <div class="led-rpm" id="led19"></div>
  </div>

  <!-- Speed -->
  <div class="speed-container">
    <h1 id="speed">0 km/h</h1>
  </div>

  <!-- Systems: DRS + ERS -->
  <div class="systems">
    <div class="drs" id="drs">DRS</div>
    <div class="ers-container">
      <div class="ers-bar" id="ers"></div>
    </div>
  </div>

</div>

<script>
// WebSocket
const ws = new WebSocket('ws://localhost:8080');

ws.onopen = () => console.log('Conectado ao servidor WebSocket');

const leds = [];
for(let i=0;i<20;i++){
    leds.push(document.getElementById('led'+i));
}

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // Velocidade
    document.getElementById('speed').innerText = `${data.speed} km/h`;

    // RPM LEDs
    const rpmPercent = data.rpm / 22000; // max RPM
    leds.forEach((led, i) => {
        led.classList.toggle('on', rpmPercent > i*0.05);
    });

    // DRS
    const drsEl = document.getElementById('drs');
    drsEl.classList.toggle('on', data.drs);

    // ERS barra
    document.getElementById('ers').style.width = `${data.ers}%`;
};

// Tela cheia
const fsBtn = document.getElementById('fullscreen-btn');
const dashboard = document.getElementById('dashboard');

fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        dashboard.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
});
</script>

</body>
</html>
