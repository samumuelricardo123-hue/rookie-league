.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.champ{border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#17221b,#0e1511);padding:18px}.champTop{display:flex;justify-content:space-between;align-items:center}.pill{font-size:10px;padding:5px 8px;border-radius:5px;background:#a6ff001a;color:var(--green);font-weight:900;letter-spacing:.7px}.champ h3{font-size:20px;margin:14px 0 3px}.meta{color:var(--muted);font-size:12px}.progress{height:7px;border-radius:20px;background:#263229;margin:15px 0 8px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:20px}.champFoot{display:flex;justify-content:space-between;color:#b8c4ba;font-size:12px}
