<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #000;
  color: #fff;
}

.background {
  position: fixed;
  inset: 0;
  background: url('fundo.jpg') center/cover no-repeat;
  filter: brightness(0.45);
  z-index: -1;
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  background: rgba(0,0,0,0.75);
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 0 25px rgba(0,255,120,0.25);
}

h1 {
  text-align: center;
  color: #4cff4c;
  margin-bottom: 15px;
  letter-spacing: 2px;
}

/* -------- TABS -------- */
.tabs {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.tab-btn {
  background: transparent;
  border: 1px solid #4cff4c;
  color: #4cff4c;
  padding: 10px 20px;
  cursor: pointer;
  margin: 0 5px;
  border-radius: 6px;
  transition: 0.3s;
}

.tab-btn.active,
.tab-btn:hover {
  background: #4cff4c;
  color: #000;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* -------- TABLE -------- */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  text-align: left;
}

th {
  border-bottom: 2px solid #4cff4c;
  color: #4cff4c;
}

tr:nth-child(even) {
  background: rgba(255,255,255,0.05);
}

/* -------- PODIUM COLORS -------- */
.p1 { color: gold; font-weight: bold; }
.p2 { color: silver; font-weight: bold; }
.p3 { color: #cd7f32; font-weight: bold; }

footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

<body>
<div class="background"></div>

<div class="container">
  <h1>ROOKIE LEAGUE</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('classificacao', this)">Classificação</button>
    <button class="tab-btn" onclick="showTab('livetiming', this)">Treino / Live Time</button>
  </div>

  <!-- CLASSIFICAÇÃO -->
  <div id="classificacao" class="tab-content active">
    <table id="tabelaClassificacao">
      <thead>
        <tr>
          <th>#</th>
          <th>Piloto</th>
          <th>Pontos</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- LIVE TIMING -->
  <div id="livetiming" class="tab-content">
    <table id="tabelaLive">
      <thead>
        <tr>
          <th>#</th>
          <th>Piloto</th>
          <th>Melhor Volta</th>
          <th>Última Volta</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>
    Assetto Corsa • Rookie League
  </footer>
</div>

<script>
/* ===== CONFIG ===== */
const URL_CLASSIFICACAO = 'resultados.json';
const URL_LIVE = 'livetiming.json';

/* ===== TABS ===== */
function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

/* ===== CLASSIFICAÇÃO ===== */
function carregarClassificacao() {
  fetch(URL_CLASSIFICACAO)
    .then(r => r.json())
    .then(data => {
      const tbody = document.querySelector('#tabelaClassificacao tbody');
      tbody.innerHTML = '';

      data.forEach(p => {
        const classe =
          p.posicao === 1 ? 'p1' :
          p.posicao === 2 ? 'p2' :
          p.posicao === 3 ? 'p3' : '';

        tbody.innerHTML += `
          <tr>
            <td class="${classe}">${p.posicao}</td>
            <td>${p.piloto}</td>
            <td>${p.pontos}</td>
          </tr>
        `;
      });
    });
}

/* ===== LIVE TIMING ===== */
function carregarLiveTiming() {
  fetch(URL_LIVE)
    .then(r => r.json())
    .then(data => {
      const tbody = document.querySelector('#tabelaLive tbody');
      tbody.innerHTML = '';

      data.forEach((p, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${p.piloto}</td>
            <td>${p.melhor_volta}</td>
            <td>${p.ultima_volta}</td>
          </tr>
        `;
      });
    });
}

/* ===== INIT ===== */
carregarClassificacao();
carregarLiveTiming();
setInterval(carregarLiveTiming, 3000);
</script>

</body>
</html>
