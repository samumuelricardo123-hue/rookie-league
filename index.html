<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Live Timing • TV Mode</title>

<style>
body {
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Segoe UI, Arial;
}

#title {
  background:#111;
  padding:10px 20px;
  font-size:22px;
  color:#1e90ff;
  border-bottom:2px solid #1e90ff;
}

#board {
  padding:10px 20px;
}

.row {
  display:flex;
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid #111;
}

.pos {
  width:30px;
  font-weight:bold;
  color:#1e90ff;
}

.name {
  flex:1;
  font-size:16px;
}

.time {
  width:110px;
  text-align:right;
  font-family:monospace;
}

.best {
  color:#00e676;
}

.leader {
  background:#0d1b2a;
}
</style>
</head>

<body>

<div id="title">LIVE TIMING</div>
<div id="board">Carregando…</div>

<script>
const LIVE_API = "https://rookie-live.yourname.workers.dev"; // PROXY

function msToTime(ms) {
  if (!ms || ms <= 0) return "--:--.---";
  let m = Math.floor(ms / 60000);
  let s = ((ms % 60000) / 1000).toFixed(3);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

async function updateTV() {
  try {
    const r = await fetch(LIVE_API);
    const d = await r.json();
    const list = d.lapStat || [];
    const board = document.getElementById("board");

    board.innerHTML = "";

    list.slice(0,10).forEach((p,i) => {
      board.innerHTML += `
        <div class="row ${i===0 ? 'leader':''}">
          <div class="pos">${i+1}</div>
          <div class="name">${p.driverName}</div>
          <div class="time best">${msToTime(p.bestLap)}</div>
        </div>
      `;
    });

  } catch {
    document.getElementById("board").innerHTML = "Sem sinal";
  }
}

setInterval(updateTV, 1000);
updateTV();
</script>

</body>
</html>
