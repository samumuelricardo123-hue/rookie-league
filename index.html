<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League | Broadcast</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#05070f;
  --panel:rgba(15,20,40,.85);
  --panel-strong:rgba(20,26,55,.95);
  --line:rgba(255,255,255,.08);
  --accent:#00e5ff;
  --gold:#ffcf5c;
  --green:#3dff9a;
  --red:#ff4d4d;
  --text:#f2f5ff;
  --muted:#9aa4d6;
}
*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial,sans-serif}
body{
  margin:0;
  background:radial-gradient(1200px 600px at top,#0a0f2a,var(--bg));
  color:var(--text);
}

/* OVERLAY */
body.overlay{background:transparent}
body.overlay header,body.overlay footer{display:none}

/* HEADER */
header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{font-weight:900;letter-spacing:5px}
.brand span{color:var(--accent)}
nav{display:flex;gap:18px}
nav button{
  background:none;border:none;
  color:var(--muted);
  font-weight:600;
  cursor:pointer;
}
nav button.active{color:var(--accent)}
.admin{font-size:12px;color:var(--muted)}

/* SECTIONS */
.section{display:none;padding:28px}
.section.active{display:block}

/* LIVE */
.leader{
  display:grid;
  grid-template-columns:90px 1fr 180px;
  gap:26px;
  padding:28px;
  border-radius:30px;
  background:var(--panel-strong);
  border:1px solid var(--line);
  margin-bottom:26px;
}
.pos{font-size:64px;font-weight:900;color:var(--gold);display:flex;align-items:center;justify-content:center}
.driver h1{margin:0;font-size:26px}
.driver small{color:var(--muted)}
.tags{display:flex;gap:8px;margin-top:8px}
.tags span{font-size:11px;padding:5px 10px;border-radius:14px;background:#1c234b}
.delta{text-align:right;display:flex;flex-direction:column;justify-content:center}
.delta strong{font-size:28px;color:var(--green)}
.rpm{margin-top:12px;height:6px;background:#10163b;border-radius:6px;overflow:hidden}
.rpm div{width:80%;height:100%;background:linear-gradient(90deg,#3dff9a,#ffcf5c,#ff4d4d)}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 420px;gap:26px}

/* TABLE */
.panel{
  background:var(--panel);
  border-radius:26px;
  border:1px solid var(--line);
  padding:22px;
}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px}
.lead{background:linear-gradient(90deg,rgba(255,207,92,.25),transparent)}

/* FORMS */
input{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
  background:#10163b;
  color:white;
  margin-bottom:12px;
}
button.primary{
  background:var(--accent);
  border:none;
  padding:12px 20px;
  border-radius:18px;
  font-weight:800;
  cursor:pointer;
  color:#000;
}
button.danger{
  background:var(--red);
  border:none;
  padding:6px 10px;
  border-radius:12px;
  color:white;
  cursor:pointer;
}
.hidden{display:none}

footer{text-align:center;font-size:11px;color:var(--muted);padding:6px}
</style>
</head>

<body>

<header>
  <div class="brand">ROOKIE <span>LEAGUE</span></div>
  <nav>
    <button class="active" onclick="show('live',this)">LIVE</button>
    <button onclick="show('champ',this)">CAMPEONATO</button>
    <button onclick="show('signup',this)">INSCRIÇÃO</button>
    <button onclick="show('login',this)">ADM</button>
  </nav>
  <div class="admin" id="adminStatus">Público</div>
</header>

<!-- LIVE -->
<div id="live" class="section active">
  <div class="leader">
    <div class="pos">P1</div>
    <div class="driver">
      <h1>#27 João Silva</h1>
      <small>BMW M4 GT3 • Best 1:32.451</small>
      <div class="tags"><span>MED</span><span>Fuel 42%</span><span>ERS 78%</span></div>
      <div class="rpm"><div></div></div>
    </div>
    <div class="delta"><small>GAP</small><strong>+0.000</strong></div>
  </div>
</div>

<!-- CAMPEONATO -->
<div id="champ" class="section">
  <div class="panel">
    <h2>Classificação</h2>
    <table>
      <thead><tr><th>POS</th><th>PILOTO</th><th>PTS</th><th class="admin-only hidden">AÇÕES</th></tr></thead>
      <tbody id="champTable"></tbody>
    </table>

    <div class="admin-only hidden">
      <h3>Editar</h3>
      <input id="cName" placeholder="Piloto">
      <input id="cPts" placeholder="Pontos">
      <button class="primary" onclick="addChamp()">Adicionar</button>
    </div>
  </div>
</div>

<!-- INSCRIÇÃO -->
<div id="signup" class="section">
  <div class="panel">
    <h2>Inscrição</h2>
    <input placeholder="Nome do Piloto">
    <input placeholder="Carro">
    <button class="primary" onclick="alert('Inscrição enviada!')">Enviar</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="section">
  <div class="panel">
    <h2>Login ADM</h2>
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button class="primary" onclick="login()">Entrar</button>
  </div>
</div>

<footer>Rookie League • Broadcast System</footer>

<script>
if(location.search.includes("overlay")){
  document.body.classList.add("overlay");
}

/* NAV */
function show(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

/* CAMPEONATO */
let isAdmin=false;
let champ=[
  {name:"João Silva",pts:52},
  {name:"Lucas Rocha",pts:44}
];

function renderChamp(){
  const tb=document.getElementById("champTable");
  tb.innerHTML="";
  champ.sort((a,b)=>b.pts-a.pts).forEach((d,i)=>{
    tb.innerHTML+=`
      <tr>
        <td>P${i+1}</td>
        <td>${d.name}</td>
        <td>${d.pts}</td>
        ${isAdmin?`<td><button class="danger" onclick="delChamp(${i})">X</button></td>`:""}
      </tr>`;
  });
}

function addChamp(){
  champ.push({name:cName.value,pts:Number(cPts.value)});
  cName.value="";cPts.value="";
  renderChamp();
}

function delChamp(i){
  champ.splice(i,1);
  renderChamp();
}

/* LOGIN */
function login(){
  if(user.value==="ADM" && pass.value==="3636"){
    isAdmin=true;
    adminStatus.innerText="Administrador";
    document.querySelectorAll(".admin-only").forEach(e=>e.classList.remove("hidden"));
    alert("Login realizado");
    renderChamp();
  }else{
    alert("Login inválido");
  }
}

renderChamp();
</script>

</body>
</html>
