<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Emperor Server • Live Timing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg-main: #141414;
  --bg-panel: #1b1b1b;
  --bg-row: #202020;
  --border: #2e2e2e;
  --text-main: #d0d0d0;
  --text-muted: #8c8c8c;
  --accent: #4caf50;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: "Segoe UI", Tahoma, sans-serif;
  font-size: 13px;
}

.container {
  max-width: 1150px;
  margin: 20px auto;
  background: var(--bg-panel);
  border: 1px solid var(--border);
}

/* ===== TOP BAR ===== */
.topbar {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--accent);
  font-weight: 600;
}

/* ===== TABS ===== */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: #171717;
}

.tab-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 8px 16px;
  cursor: pointer;
  border-right: 1px solid var(--border);
  font-size: 12px;
}

.tab-btn.active {
  background: var(--bg-panel);
  color: var(--accent);
}

.tab-btn:hover {
  background: #232323;
}

/* ===== CONTENT ===== */
.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #161616;
}

th {
  color: var(--text-muted);
  font-weight: 500;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}

td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
}

tbody tr {
  background: var(--bg-panel);
}

tbody tr:nth-child(even) {
  background: var(--bg-row);
}

tbody tr:hover {
  background: #262626;
}

/* ===== POSITION COLORS ===== */
.p1 { color: #ffd700; }
.p2 { color: #cfcfcf; }
.p3 { color: #c48b5a; }

/* ===== FOOTER ===== */
.footer {
  padding: 6px 10px;
  font-size: 11px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}
</style>
</head>

<body>

<div class="container">
  <div class="topbar">Emperor Server • Assetto Corsa</div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('classificacao', this)">CLASSIFICAÇÃO</button>
    <button class="tab-btn" onclick="showTab('livetiming', this)">LIVE TIMING</button>
  </div>

  <!-- CLASSIFICAÇÃO -->
  <div id="classificacao" class="tab-content active">
    <table id="tabelaClassificacao">
      <thead>
