<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACSM 2.4 - Gerenciador de Servidores</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212 url('https://i.imgur.com/Z6Pq1tU.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: rgba(0,0,0,0.8);
      padding: 20px;
      text-align: center;
    }

    header img.logo {
      height: 60px;
    }

    h1, h2 {
      margin: 10px 0;
    }

    main {
      padding: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    table, th, td {
      border: 1px solid #fff;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: #1e90ff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d6efd;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: rgba(0,0,0,0.8);
    }

    /* Extras: cores para status */
    .status-online {
      color: #00ff00;
      font-weight: bold;
    }
    .status-offline {
      color: #ff0000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://i.imgur.com/7Xj6A2Q.png" alt="ACSM Logo" class="logo">
    <h1>Assetto Corsa Server Manager 2.4</h1>
  </header>

  <main>
    <section class="server-list">
      <h2>Servidores Ativos</h2>
      <table>
        <thead>
          <tr>
            <th>Servidor</th>
            <th>IP</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="servers">
          <!-- Servidores serão carregados via JS -->
        </tbody>
      </table>
    </section>

    <section class="add-server">
      <h2>Adicionar Novo Servidor</h2>
      <form id="server-form">
        <input type="text" id="name" placeholder="Nome do servidor" required>
        <input type="text" id="ip" placeholder="IP do servidor" required>
        <button type="submit">Adicionar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 ACSM 2.4</p>
  </footer>

  <script>
    const serverForm = document.getElementById('server-form');
    const serversTbody = document.getElementById('servers');

    let servers = [];

    serverForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const ip = document.getElementById('ip').value;
      
      const server = {
        name,
        ip,
        status: 'Offline'
      };

      servers.push(server);
      renderServers();
      serverForm.reset();
    });

    function renderServers() {
      serversTbody.innerHTML = '';
      servers.forEach((server, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${server.name}</td>
          <td>${server.ip}</td>
          <td class="${server.status === 'Online' ? 'status-online' : 'status-offline'}">${server.status}</td>
          <td>
            <button onclick="startServer(${index})">Iniciar</button>
            <button onclick="stopServer(${index})">Parar</button>
          </td>
        `;
        serversTbody.appendChild(tr);
      });
    }

    function startServer(index) {
      servers[index].status = 'Online';
      renderServers();
    }

    function stopServer(index) {
      servers[index].status = 'Offline';
      renderServers();
    }
  </script>
</body>
</html>
