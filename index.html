<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League | Live Timing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b0b0d;
  --panel:#15151e;
  --panel2:#1d1d27;
  --line:#2a2a38;
  --red:#e10600;
  --green:#00ff9c;
  --yellow:#ffd166;
  --text:#ffffff;
  --muted:#9a9aa5;
}

*{
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* OVERLAY */
body.overlay header,
body.overlay footer{
  display:none;
}

/* HEADER */
header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:#000;
  border-bottom:2px solid var(--red);
}

.brand{
  font-weight:900;
  letter-spacing:3px;
}
.brand span{color:var(--red)}

nav{
  display:flex;
  gap:16px;
}
nav button{
  background:none;
  border:none;
  color:#ccc;
  font-weight:700;
  cursor:pointer;
}
nav button.active{
  color:white;
  border-bottom:3px solid var(--red);
}

.admin{
  font-size:11px;
  color:var(--muted);
}

/* SECTIONS */
.section{
  display:none;
  padding:20px;
}
.section.active{
  display:block;
}

/* LEADER BAR */
.leader{
  display:grid;
  grid-template-columns:80px 1fr 160px;
  align-items:center;
  background:linear-gradient(90deg,#000,#14141c);
  border-left:6px solid var(--red);
  padding:18px;
  margin-bottom:20px;
}

.pos{
  font-size:48px;
  font-weight:900;
  text-align:center;
}

.driver h1{
  margin:0;
  font-size:22px;
}
.driver small{
  color:var(--muted);
}

.stats{
  display:flex;
  gap:10px;
  margin-top:6px;
}
.stats span{
  background:#1e1e28;
  padding:4px 8px;
  font-size:11px;
}

.delta{
  text-align:right;
}
.delta small{
  color:var(--muted);
}
.delta strong{
  font-size:22px;
  color:var(--green);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:20px;
}

/* TABLE */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
th{
  color:var(--muted);
  font-size:12px;
}
.lead{
  background:#1a1a24;
}

/* TRACK MAP */
.track{
  background:var(--panel);
  border:1px solid var(--line);
  padding:14px;
}
.track-title{
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}
.track svg{
  width:100%;
  height:260px;
}
.track path{
  fill:none;
  stroke:#3a3a4d;
  stroke-width:20;
  stroke-linecap:round;
}
.ideal{
  stroke:var(--red);
  stroke-width:6;
  stroke-dasharray:14 18;
  animation:dash 6s linear infinite;
}
@keyframes dash{
  to{stroke-dashoffset:-420}
}
.car{
  fill:white;
}

/* FORMS */
input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:#101018;
  border:1px solid var(--line);
  color:white;
}
button.primary{
  background:var(--red);
  border:none;
  padding:10px;
  width:100%;
  font-weight:800;
  color:white;
  cursor:pointer;
}
button.danger{
  background:#a00000;
  border:none;
  padding:4px 8px;
  color:white;
  cursor:pointer;
}
.hidden{
  display:none;
}

footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:6px;
}
</style>
</head>

<body>

<header>
  <div class="brand">ROOKIE <span>LEAGUE</span></div>
  <nav>
    <button class="active" onclick="show('live',this)">LIVE</button>
    <button onclick="show('champ',this)">CAMPEONATO</button>
    <button onclick="show('signup',this)">INSCRIÇÃO</button>
    <button onclick="show('login',this)">ADM</button>
  </nav>
  <div class="admin" id="adminStatus">Público</div>
</header>

<!-- LIVE -->
<div id="live" class="section active">

  <div class="leader">
    <div class="pos">P1</div>
    <div class="driver">
      <h1>#27 João Silva</h1>
      <small>BMW M4 GT3 • 1:32.451</small>
      <div class="stats">
        <span>MED</span>
        <span>Fuel 42%</span>
        <span>ERS 78%</span>
      </div>
    </div>
    <div class="delta">
      <small>GAP</small>
      <strong>+0.000</strong>
    </div>
  </div>

  <div class="grid">

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>POS</th><th>PILOTO</th><th>VOLTA</th><th>Δ</th>
          </tr>
        </thead>
        <tbody>
          <tr class="lead"><td>P1</td><td>#27 João Silva</td><td>1:32.451</td><td>—</td></tr>
          <tr><td>P2</td><td>#11 Lucas Rocha</td><td>1:32.980</td><td>+0.529</td></tr>
          <tr><td>P3</td><td>#44 Pedro Lima</td><td>1:33.102</td><td>+0.651</td></tr>
        </tbody>
      </table>
    </div>

    <div class="track">
      <div class="track-title">TRACK MAP</div>
      <svg viewBox="0 0 600 320">
        <path d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
        <path class="ideal" d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
        <circle id="car" class="car" cx="80" cy="160" r="7"/>
      </svg>
    </div>

  </div>
</div>

<!-- CAMPEONATO -->
<div id="champ" class="section">
  <div class="panel">
    <table>
      <thead>
        <tr><th>POS</th><th>PILOTO</th><th>PTS</th><th class="admin-only hidden">AÇÕES</th></tr>
      </thead>
      <tbody id="champTable"></tbody>
    </table>

    <div class="admin-only hidden" style="padding:12px">
      <input id="cName" placeholder="Piloto">
      <input id="cPts" placeholder="Pontos">
      <button class="primary" onclick="addChamp()">Adicionar</button>
    </div>
  </div>
</div>

<!-- INSCRIÇÃO -->
<div id="signup" class="section">
  <div class="panel" style="padding:16px">
    <input placeholder="Nome do Piloto">
    <input placeholder="Carro">
    <button class="primary">Enviar</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="section">
  <div class="panel" style="padding:16px">
    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button class="primary" onclick="login()">Entrar</button>
  </div>
</div>

<footer>Rookie League • Live Timing</footer>

<script>
if(location.search.includes("overlay")){
  document.body.classList.add("overlay");
}

function show(id,btn){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  btn.classList.add("active");
}

/* CAMPEONATO */
let isAdmin=false;
let champ=[
  {name:"João Silva",pts:52},
  {name:"Lucas Rocha",pts:44}
];

function renderChamp(){
  const tb=document.getElementById("champTable");
  tb.innerHTML="";
  champ.sort((a,b)=>b.pts-a.pts).forEach((d,i)=>{
    tb.innerHTML+=`
      <tr>
        <td>P${i+1}</td>
        <td>${d.name}</td>
        <td>${d.pts}</td>
        ${isAdmin?`<td><button class="danger" onclick="delChamp(${i})">X</button></td>`:""}
      </tr>`;
  });
}

function addChamp(){
  champ.push({name:cName.value,pts:Number(cPts.value)});
  cName.value="";cPts.value="";
  renderChamp();
}

function delChamp(i){
  champ.splice(i,1);
  renderChamp();
}

/* LOGIN */
function login(){
  if(user.value==="ADM" && pass.value==="3636"){
    isAdmin=true;
    adminStatus.innerText="Administrador";
    document.querySelectorAll(".admin-only").forEach(e=>e.classList.remove("hidden"));
    alert("Login ADM realizado");
    renderChamp();
  }else{
    alert("Login inválido");
  }
}

renderChamp();

/* TRACK ANIMATION */
let t=0;
setInterval(()=>{
  t+=0.02;
  car.setAttribute("cx",80+420*Math.abs(Math.sin(t)));
  car.setAttribute("cy",160+110*Math.sin(t*1.1));
},50);
</script>

</body>
</html>
