<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato Assetto Corsa</title>
    <style>
        /* Estilo geral */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0a0a0a; /* fundo escuro estilo F1 */
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        /* Cabeçalho com logotipo */
        header {
            background: linear-gradient(90deg, #0f9d58, #34a853); /* gradiente verde */
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        /* Logotipo RL com gradiente verde moderno */
        .logo-rl {
            font-family: 'Arial Black', sans-serif;
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #00ff6a, #00b33c, #007a1f); /* gradiente verde */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 3px 3px 8px rgba(0,0,0,0.7);
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .logo-rl span {
            display: inline-block;
            transform: skew(-15deg); /* inclinação para velocidade estilo F1 */
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 1px;
        }

        main {
            padding: 2rem;
            max-width: 900px;
            margin: auto;
        }

        /* Tabela estilo F1 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        th {
            padding: 0.8rem;
            border: 1px solid #444;
            text-align: center;
            background-color: #1b5e20; /* verde escuro */
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 0.7rem;
            border: 1px solid #333;
            text-align: center;
            background-color: #121212; /* fundo escuro das células */
        }

        tr:nth-child(even) td {
            background-color: #1a1a1a; /* linha alternada mais escura */
        }

        /* Botões estilo F1 */
        button {
            background-color: #34a853; /* verde */
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            margin: 0.1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
        }

        button:hover {
            background-color: #0f9d58; /* verde mais escuro */
            transform: scale(1.05);
        }

        #addDriverBtn {
            background-color: #1b5e20;
            padding: 0.6rem 1rem;
            font-size: 1rem;
        }

        #addDriverBtn:hover {
            background-color: #145214;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-rl">
            <span>R</span><span>L</span>
        </div>
        <h1>Campeonato Assetto Corsa</h1>
    </header>

    <main>
        <table id="pontosTable">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Piloto</th>
                    <th>Pontos</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Exemplo Piloto</td>
                    <td>25</td>
                    <td>
                        <button onclick="addPoints(this, 25)">+25</button>
                        <button onclick="addPoints(this, 18)">+18</button>
                        <button onclick="addPoints(this, 15)">+15</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <button id="addDriverBtn">Adicionar Piloto</button>
    </main>

    <script>
        // Função para adicionar pontos
        function addPoints(button, points) {
            const row = button.closest("tr");
            const cell = row.querySelector("td:nth-child(3)");
            let currentPoints = parseInt(cell.textContent);
            cell.textContent = currentPoints + points;
            sortTable();
        }

        // Função para adicionar piloto
        document.getElementById("addDriverBtn").addEventListener("click", () => {
            const name = prompt("Nome do piloto:");
            if (!name) return;

            const table = document.getElementById("pontosTable").querySelector("tbody");
            const newRow = document.createElement("tr");

            newRow.innerHTML = `
                <td></td>
                <td>${name}</td>
                <td>0</td>
                <td>
                    <button onclick="addPoints(this, 25)">+25</button>
                    <button onclick="addPoints(this, 18)">+18</button>
                    <button onclick="addPoints(this, 15)">+15</button>
                </td>
            `;
            table.appendChild(newRow);
            sortTable();
        });

        // Função para ordenar tabela por pontos
        function sortTable() {
            const tbody = document.querySelector("#pontosTable tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));

            rows.sort((a, b) => {
                return parseInt(b.cells[2].textContent) - parseInt(a.cells[2].textContent);
            });

            rows.forEach((row, index) => {
                row.cells[0].textContent = index + 1;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
