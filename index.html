<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Dashboard Avançado</title>
<style>
/* Reset básico */
body { margin: 0; font-family: 'Arial', sans-serif; background: #0a0a0a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }

/* Layout principal */
.dashboard {
    display: grid;
    grid-template-areas:
        "wheel rpm"
        "speed rpm"
        "systems systems";
    grid-gap: 30px;
    text-align: center;
}

/* Volante F1 */
.steering-wheel { grid-area: wheel; display: flex; justify-content: center; align-items: center; }
.wheel {
    width: 220px;
    height: 220px;
    border: 12px solid #333;
    border-radius: 50%;
    position: relative;
    background: radial-gradient(circle at center, #111 0%, #222 100%);
}
.gear-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3em; color: #ff0; font-weight: bold;
}

/* LEDs Shift */
.shift-leds {
    position: absolute;
    width: 200px; height: 200px;
    top: 10px; left: 10px;
    pointer-events: none;
}
.led {
    position: absolute;
    width: 20px; height: 6px;
    background: #333;
    border-radius: 3px;
}
.led.on { background: red; }

/* RPM */
.rpm-container { grid-area: rpm; display: flex; flex-direction: column; align-items: center; }
.rpm-meter { position: relative; width: 180px; height: 180px; border-radius: 50%; background: #111; border: 8px solid #333; }
.needle { position: absolute; width: 4px; height: 90px; background: red; top: 50%; left: 50%; transform-origin: bottom center; transform: rotate(-135deg); transition: transform 0.1s ease-out; }
.rpm-zones { position: absolute; width: 100%; height: 100%; border-radius: 50%; pointer-events: none; }
.zone { position: absolute; width: 50%; height: 50%; top: 25%; left: 25%; border-radius: 50%; clip-path: polygon(50% 50%, 100% 0%, 100% 100%); opacity: 0.2; }
.rpm-value { margin-top: 10px; font-size: 1.5em; }

/* Speed */
.speed-container h1 { grid-area: speed; font-size: 4em; color: #0ff; }

/* DRS / ERS */
.systems { grid-area: systems; display: flex; justify-content: center; gap: 40px; font-size: 1.2em; }
.drs { color: #ff0; font-weight: bold; }
.ers { color: #0f0; font-weight: bold; }
</style>
</head>
<body>
<div class="dashboard">

  <!-- Volante F1 -->
  <div class="steering-wheel">
    <div class="wheel">
      <div class="gear-display" id="gear">N</div>
      <div class="shift-leds" id="shift-leds">
        <div class="led" style="top:10px; left:10px;"></div>
        <div class="led" style="top:10px; left:40px;"></div>
        <div class="led" style="top:10px; left:70px;"></div>
        <div class="led" style="top:10px; left:100px;"></div>
        <div class="led" style="top:10px; left:130px;"></div>
      </div>
    </div>
  </div>

  <!-- RPM -->
  <div class="rpm-container">
    <div class="rpm-meter">
      <div class="needle" id="rpm-needle"></div>
    </div>
    <div class="rpm-value" id="rpm">0 RPM</div>
  </div>

  <!-- Speed -->
  <div class="speed-container">
    <h1 id="speed">0 km/h</h1>
  </div>

  <!-- DRS / ERS -->
  <div class="systems">
    <div class="drs" id="drs">DRS: OFF</div>
    <div class="ers" id="ers">ERS: 0%</div>
  </div>

</div>

<script>
// Conexão WebSocket
const ws = new WebSocket('ws://localhost:8080');

ws.onopen = () => console.log('Conectado ao servidor WebSocket');

// Seleção de LEDs shift
const leds = Array.from(document.querySelectorAll('#shift-leds .led'));

ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // Velocidade
    document.getElementById('speed').innerText = `${data.speed} km/h`;

    // RPM
    document.getElementById('rpm').innerText = `${data.rpm} RPM`;
    const maxRpm = 22000;
    const deg = (data.rpm / maxRpm) * 270 - 135;
    document.getElementById('rpm-needle').style.transform = `rotate(${deg}deg)`;

    // Gear
    document.getElementById('gear').innerText = data.gear;

    // DRS
    document.getElementById('drs').innerText = `DRS: ${data.drs ? 'ON' : 'OFF'}`;

    // ERS
    document.getElementById('ers').innerText = `ERS: ${data.ers}%`;

    // LEDs Shift
    const rpmPercent = data.rpm / maxRpm;
    leds.forEach((led, i) => {
        led.classList.toggle('on', rpmPercent > i * 0.15);
    });
};
</script>
</body>
</html>
