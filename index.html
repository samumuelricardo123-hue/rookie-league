<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League • TV Broadcast</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#03050a;
  --glass:rgba(18,24,44,.65);
  --panel:#0d1428;
  --panel2:#141d38;
  --accent:#00e6ff;
  --accent2:#ffd166;
  --green:#4dff88;
  --red:#ff4d4d;
  --purple:#b88cff;
  --text:#e8edff;
  --muted:#7d88b6;
}

*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial,sans-serif}

body{
  margin:0;
  background:
    radial-gradient(circle at 30% 0,#0f1c44,#03050a 60%),
    radial-gradient(circle at 80% 100%,#0b1433,#03050a 60%);
  color:var(--text);
  overflow:hidden;
}

/* ===== TOP BAR ===== */
.topbar{
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  backdrop-filter:blur(12px);
  background:linear-gradient(180deg,rgba(0,0,0,.7),rgba(0,0,0,.35));
  border-bottom:1px solid #1f2a52;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:4px;
}
.logo span{color:var(--accent)}

.session{
  font-size:13px;
  color:var(--muted);
}

/* ===== MAIN ===== */
.main{
  display:grid;
  grid-template-columns: 1fr 480px;
  height:calc(100vh - 74px);
}

/* ===== LEFT ===== */
.left{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* ===== LEADER CARD ===== */
.leader{
  position:relative;
  display:flex;
  align-items:center;
  gap:22px;
  padding:22px;
  border-radius:22px;
  background:var(--glass);
  border:1px solid rgba(255,255,255,.06);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.02),
    0 30px 60px rgba(0,0,0,.6);
  overflow:hidden;
}

.leader::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08),transparent 70%);
  animation:sweep 6s infinite;
}

@keyframes sweep{
  from{transform:translateX(-100%)}
  to{transform:translateX(100%)}
}

.pos{
  font-size:62px;
  font-weight:900;
  color:var(--accent2);
}

.driver h2{margin:0;font-size:24px}
.driver small{color:var(--muted)}

.tyres{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.tyres span{
  padding:3px 8px;
  font-size:11px;
  border-radius:10px;
  background:#1f2b55;
}

.tyres .soft{background:#ff4d4d}
.tyres .medium{background:#ffd166;color:#000}
.tyres .hard{background:#bcd6ff;color:#000}

.delta{
  margin-left:auto;
  text-align:right;
}

.delta span{
  font-size:24px;
  font-weight:800;
  color:var(--green);
}

/* ===== RPM ===== */
.rpm{
  height:6px;
  background:#1a2348;
  border-radius:6px;
  overflow:hidden;
  margin-top:8px;
}

.rpm div{
  width:78%;
  height:100%;
  background:linear-gradient(90deg,#4dff88,#ffd166,#ff4d4d);
}

/* ===== GRID ===== */
.table{
  background:var(--glass);
  border-radius:22px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{background:var(--panel2)}

th,td{
  padding:13px 16px;
  font-size:14px;
}

th{
  color:var(--muted);
  font-weight:500;
}

tbody tr{
  border-bottom:1px solid rgba(255,255,255,.06);
}

tbody tr.lead{
  background:linear-gradient(90deg,rgba(255,209,102,.18),transparent);
}

/* ===== RIGHT ===== */
.right{
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

/* ===== BOX ===== */
.box{
  background:var(--glass);
  border-radius:22px;
  padding:18px;
  border:1px solid rgba(255,255,255,.06);
}

/* ===== TRACK ===== */
.track svg{width:100%;height:280px}

.track path{
  fill:none;
  stroke:#3a4675;
  stroke-width:20;
  stroke-linecap:round;
}

.track .ideal{
  stroke:var(--accent);
  stroke-width:6;
  stroke-dasharray:10 16;
  animation:dash 6s linear infinite;
}

@keyframes dash{
  to{stroke-dashoffset:-400}
}

.car{
  fill:#fff;
  filter:drop-shadow(0 0 8px var(--accent));
}

/* ===== INFO ===== */
.info p{
  margin:8px 0;
  font-size:14px;
}

.flag{
  display:inline-block;
  width:12px;
  height:12px;
  border-radius:50%;
  margin-right:6px;
}

.green{background:var(--green)}
.yellow{background:#ffd166}
.red{background:var(--red)}

/* ===== FOOTER ===== */
footer{
  position:absolute;
  bottom:0;
  width:100%;
  font-size:11px;
  text-align:center;
  padding:6px;
  color:var(--muted);
  background:rgba(0,0,0,.35);
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">ROOKIE <span>LEAGUE</span></div>
  <div class="session">RACE • LAP 8 / 15 • GREEN FLAG</div>
</div>

<div class="main">

<div class="left">

  <div class="leader">
    <div class="pos">P1</div>
    <div class="driver">
      <h2>#27 João Silva</h2>
      <small>BMW M4 GT3 • Best 1:32.451</small>

      <div class="tyres">
        <span class="medium">MED</span>
        <span>Fuel 42%</span>
        <span>ERS 78%</span>
      </div>

      <div class="rpm"><div></div></div>
    </div>

    <div class="delta">
      <small>GAP</small>
      <span>+0.000</span>
    </div>
  </div>

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>POS</th>
          <th>PILOTO</th>
          <th>SET</th>
          <th>VOLTA</th>
          <th>Δ</th>
        </tr>
      </thead>
      <tbody id="grid"></tbody>
    </table>
  </div>

</div>

<div class="right">

  <div class="box track">
    <svg viewBox="0 0 600 320">
      <path d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
      <path class="ideal" d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
      <circle class="car" id="car" cx="80" cy="160" r="7"/>
    </svg>
  </div>

  <div class="box info">
    <p><span class="flag green"></span>Status: <strong>Green Flag</strong></p>
    <p>Clima: <strong>Clear</strong></p>
    <p>Servidor: <strong>Rookie League</strong></p>
    <p>Track: <strong>Auto-Generated</strong></p>
  </div>

</div>

</div>

<footer>TV Broadcast Mode • ACSM Style • Ready for Live Data</footer>

<script>
const data=[
 {p:1,n:"#27 João Silva",s:"S1",l:"1:32.451",d:"—"},
 {p:2,n:"#11 Lucas Rocha",s:"S2",l:"1:32.980",d:"+0.529"},
 {p:3,n:"#44 Pedro Lima",s:"S1",l:"1:33.102",d:"+0.651"},
 {p:4,n:"#08 Matheus Alves",s:"S3",l:"1:33.420",d:"+0.969"},
 {p:5,n:"#99 Rafael Costa",s:"S2",l:"1:33.701",d:"+1.250"}
];

const grid=document.getElementById("grid");

data.forEach(d=>{
  const tr=document.createElement("tr");
  if(d.p===1) tr.classList.add("lead");
  tr.innerHTML=`
    <td>P${d.p}</td>
    <td>${d.n}</td>
    <td style="color:${d.s==='S1'?'#b88cff':d.s==='S2'?'#4dff88':'#ffd166'}">${d.s}</td>
    <td>${d.l}</td>
    <td>${d.d}</td>`;
  grid.appendChild(tr);
});

/* animação carro */
let t=0;
setInterval(()=>{
  t+=0.02;
  const car=document.getElementById("car");
  car.setAttribute("cx",80+420*Math.abs(Math.sin(t)));
  car.setAttribute("cy",160+110*Math.sin(t*1.1));
},50);
</script>

</body>
</html>
