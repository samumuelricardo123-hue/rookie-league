const API_URL = "http://plugins.rookieleague.emperorservers.com:9605/lapstat";

function msToTime(ms) {
  if (!ms || ms <= 0) return "-";
  let minutes = Math.floor(ms / 60000);
  let seconds = ((ms % 60000) / 1000).toFixed(3);
  return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
}
