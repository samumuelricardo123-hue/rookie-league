<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>AC Server Manager - Timing</title>
<style>
body {
  margin: 0;
  font-family: Segoe UI, Tahoma, sans-serif;
  font-size: 12px;
  background: #121212;
  color: #d6d6d6;
}

.header {
  padding: 8px 12px;
  background: #1b1b1b;
  border-bottom: 1px solid #2c2c2c;
  color: #4caf50;
}

.tabs {
  display: flex;
  background: #181818;
  border-bottom: 1px solid #2c2c2c;
}

.tabs button {
  padding: 8px 14px;
  background: none;
  border: none;
  color: #9a9a9a;
  cursor: pointer;
}

.tabs button.active {
  background: #1f1f1f;
  color: #4caf50;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 6px 10px;
  border-bottom: 1px solid #2c2c2c;
}

th {
  color: #9a9a9a;
  font-weight: 500;
  background: #191919;
}

tr:nth-child(even) {
  background: #202020;
}

.p1 { color: gold; }
.p2 { color: silver; }
.p3 { color: #cd7f32; }
</style>
</head>

<body>

<div class="header">Assetto Corsa Server Manager</div>

<div class="tabs">
  <button class="active" onclick="showTab('classificacao', this)">Timing</button>
  <button onclick="showTab('live', this)">Live</button>
</div>

<div id="classificacao">
  <table>
    <thead>
      <tr><th>#</th><th>Driver</th><th>Points</th></tr>
    </thead>
    <tbody id="classBody"></tbody>
  </table>
</div>

<div id="live" style="display:none">
  <table>
    <thead>
      <tr><th>#</th><th>Driver</th><th>Best</th><th>Last</th></tr>
    </thead>
    <tbody id="liveBody"></tbody>
  </table>
</div>
