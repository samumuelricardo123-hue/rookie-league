<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Ferrari Display com Divisões</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
}

.dashboard {
    position: relative;
    width: 100%;
    height: 100%;
}

/* Linhas de divisão horizontais */
.divider-horizontal {
    position: absolute;
    width: 90%;
    height: 2px;
    background: rgba(255,255,255,0.2);
    left: 50%;
    transform: translateX(-50%);
}

/* RPM semicircular LEDs */
.rpm-container {
    position: absolute;
    top: 2%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}
.led-rpm {
    border-radius: 50%;
    margin: 0.2vw;
    background: #111;
    transition: all 0.1s;
}
.led-rpm.green.on { background: #0f0; box-shadow: 0 0 6px #0f0; }
.led-rpm.yellow.on { background: #ff0; box-shadow: 0 0 8px #ff0; }
.led-rpm.red.on { background: #f00; box-shadow: 0 0 10px #f00; }

/* Speed central */
.speed-container {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translateX(-50%);
    color: #ff0;
    text-shadow: 0 0 15px #ff0, 0 0 30px #ff0;
    font-weight: bold;
    text-align: center;
    padding: 0.5vh 1vw;
    border-radius: 5px;
    background: rgba(255,255,255,0.05);
}

/* Gear central */
.gear-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translateX(-50%);
    color: #ff0;
    font-weight: bold;
    text-shadow: 0 0 20px #ff0;
    padding: 0.5vh 1vw;
    border-radius: 5px;
    background: rgba(255,255,255,0.05);
}

/* Lap and Delta */
.lap-container, .delta-container {
    position: absolute;
    top: 68%;
    font-weight: bold;
    padding: 0.3vh 0.5vw;
    border-radius: 5px;
    background: rgba(255,255,255,0.05);
}
.lap-container { left: 5%; color: #0ff; }
.delta-container { right: 5%; color: #f00; }

/* Divider horizontal abaixo RPM */
.divider-rpm {
    top: 30%;
}

/* Tires */
.tires-container {
    position: absolute;
    bottom: 15%;
    width: 100%;
    display: flex;
    justify-content: space-around;
    padding: 0 5%;
    border-top: 2px solid rgba(255,255,255,0.2);
    padding-top: 1vh;
}
.tire { display: flex; flex-direction: column; align-items: center; font-weight: bold; }
.tire span { margin-top: 0.2em; }

/* Systems */
.systems {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5vw;
    align-items: center;
    border-top: 2px solid rgba(255,255,255,0.2);
    padding-top: 1vh;
}
/* DRS */
.drs {
    width: 8vw;
    height: 3vh;
    background: #333;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
    transition: all 0.2s;
}
.drs.on { background: #ff0; color: #000; box-shadow: 0 0 10px #ff0; animation: blink 1s infinite; }
@keyframes blink { 0%,50%,100%{opacity:1} 25%,75%{opacity:0.4} }

/* ERS barra */
.ers-container {
    width: 20vw;
    height: 3vh;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}
.ers-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #0f0,#ff0,#f00);
    box-shadow: 0 0 8px #f00;
    transition: width 0.2s;
}

/* Fullscreen button */
.fullscreen-btn {
    position: fixed;
    top: 1vh;
    right: 1vw;
    background: #222;
    color: #fff;
    border: none;
    padding: 1vh 1vw;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
}
</style>
</head>
<body>

<button class="fullscreen-btn" id="fullscreen-btn">Tela Cheia</button>

<div class="dashboard">

  <!-- Divider RPM -->
  <div class="divider-horizontal divider-rpm"></div>

  <!-- RPM -->
  <div class="rpm-container" id="rpm-container">
    ${[...Array(20).keys()].map(i => `<div class="led-rpm ${i<5?'green':i<10?'yellow':'red'}" id="led${i}"></div>`).join('')}
  </div>

  <!-- Speed -->
  <div class="speed-container" id="speed">0</div>

  <!-- Gear -->
  <div class="gear-display" id="gear">N</div>

  <!-- Lap and Delta -->
  <div class="lap-container" id="lap">Volta: 0</div>
  <div class="delta-container" id="delta">+0.000</div>

  <!-- Tires -->
  <div class="tires-container">
    <div class="tire">FL <span id="tireFL">0°C</span></div>
    <div class="tire">FR <span id="tireFR">0°C</span></div>
    <div class="tire">RL <span id="tireRL">0°C</span></div>
    <div class="tire">RR <span id="tireRR">0°C</span></div>
  </div>

  <!-- Systems -->
  <div class="systems">
    <div class="drs" id="drs">DRS</div>
    <div class="ers-container"><div class="ers-bar" id="ers"></div></div>
  </div>

</div>

<script>
// WebSocket
const ws = new WebSocket('ws://localhost:8080');
ws.onopen = ()=>console.log('Conectado');

// LEDs RPM
const leds = [];
for(let i=0;i<20;i++) leds.push(document.getElementById('led'+i));

ws.onmessage = (event)=>{
    const data = JSON.parse(event.data);
    document.getElementById('speed').innerText = data.speed;
    document.getElementById('gear').innerText = data.gear;
    document.getElementById('lap').innerText = `Volta: ${data.lap}`;
    document.getElementById('delta').innerText = data.delta;

    ['FL','FR','RL','RR'].forEach(t=>{
        const el = document.getElementById('tire'+t);
        el.innerText = data.tires[t]+'°C';
        el.style.color = data.tires[t]<70?'#0f0':data.tires[t]<100?'#ff0':'#f00';
    });

    const rpmPercent = data.rpm/22000;
    leds.forEach((led,i)=>led.classList.toggle('on', rpmPercent > i*0.05));

    document.getElementById('drs').classList.toggle('on', data.drs);
    document.getElementById('ers').style.width = `${data.ers}%`;
};

// Fullscreen
document.getElementById('fullscreen-btn').addEventListener('click', ()=>{
    const dash = document.querySelector('.dashboard');
    if(!document.fullscreenElement) dash.requestFullscreen();
    else document.exitFullscreen();
});

// Responsividade dinâmica
function resizeDashboard(){
    const w = window.innerWidth;
    const h = window.innerHeight;

    const ledSize = Math.max(Math.min(w,h)/25, 10);
    leds.forEach(led=>{
        led.style.width = `${ledSize}px`;
        led.style.height = `${ledSize}px`;
        led.style.margin = `${ledSize/8}px`;
    });

    document.getElementById('speed').style.fontSize = `${Math.max(w,h)/8}px`;
    document.getElementById('gear').style.fontSize = `${Math.max(w,h)/15}px`;
    document.getElementById('lap').style.fontSize = `${Math.max(w,h)/30}px`;
    document.getElementById('delta').style.fontSize = `${Math.max(w,h)/30}px`;
}
window.addEventListener('resize', resizeDashboard);
resizeDashboard();
</script>
</body>
</html>
