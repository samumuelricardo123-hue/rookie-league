<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League | Live Timing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#05070f;
  --panel:rgba(15,20,40,.82);
  --panel-strong:rgba(20,26,55,.92);
  --line:rgba(255,255,255,.08);
  --accent:#00e5ff;
  --gold:#ffcf5c;
  --green:#3dff9a;
  --red:#ff4d4d;
  --text:#f2f5ff;
  --muted:#9aa4d6;
}

*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial,sans-serif}

body{
  margin:0;
  background:radial-gradient(1200px 600px at top,#0a0f2a,var(--bg));
  color:var(--text);
}

/* OVERLAY */
body.overlay{
  background:transparent;
}
body.overlay header,
body.overlay footer{display:none}

/* HEADER */
header{
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.brand{
  font-weight:900;
  letter-spacing:5px;
}
.brand span{color:var(--accent)}

nav{display:flex;gap:18px}
nav button{
  background:none;
  border:none;
  color:var(--muted);
  font-weight:600;
  cursor:pointer;
}
nav button.active{color:var(--accent)}

.admin{font-size:12px;color:var(--muted)}

/* SECTIONS */
.section{display:none;padding:28px}
.section.active{display:block}

/* LEADER CARD */
.leader{
  display:grid;
  grid-template-columns:90px 1fr 180px;
  gap:26px;
  padding:28px;
  border-radius:30px;
  background:linear-gradient(145deg,var(--panel-strong),rgba(10,14,35,.9));
  border:1px solid var(--line);
  margin-bottom:26px;
}

.pos{
  font-size:64px;
  font-weight:900;
  color:var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
}

.driver h1{
  margin:0;
  font-size:26px;
}
.driver small{
  color:var(--muted);
  display:block;
  margin-top:4px;
}

.tags{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.tags span{
  font-size:11px;
  padding:5px 10px;
  border-radius:14px;
  background:#1c234b;
}

.delta{
  text-align:right;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.delta small{color:var(--muted)}
.delta strong{
  font-size:30px;
  color:var(--green);
}

/* RPM */
.rpm{
  margin-top:12px;
  height:6px;
  background:#10163b;
  border-radius:6px;
  overflow:hidden;
}
.rpm div{
  width:82%;
  height:100%;
  background:linear-gradient(90deg,#3dff9a,#ffcf5c,#ff4d4d);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 440px;
  gap:26px;
}

/* TABLE */
.table{
  background:var(--panel);
  border-radius:26px;
  border:1px solid var(--line);
  overflow:hidden;
}
table{width:100%;border-collapse:collapse}
th,td{
  padding:14px 16px;
  border-bottom:1px solid var(--line);
}
th{color:var(--muted);font-size:12px}
.lead{
  background:linear-gradient(90deg,rgba(255,207,92,.22),transparent);
}

/* TRACK */
.track{
  background:var(--panel);
  border-radius:26px;
  border:1px solid var(--line);
  padding:18px;
}
.track svg{width:100%;height:300px}
.track path{
  fill:none;
  stroke:#2f3a6a;
  stroke-width:22;
  stroke-linecap:round;
}
.ideal{
  stroke:var(--accent);
  stroke-width:7;
  stroke-dasharray:14 18;
  animation:dash 6s linear infinite;
}
@keyframes dash{to{stroke-dashoffset:-420}}
.car{
  fill:white;
  filter:drop-shadow(0 0 10px var(--accent));
}

/* FORMS */
.box{
  background:var(--panel);
  border-radius:26px;
  border:1px solid var(--line);
  padding:26px;
}
input{
  width:100%;
  background:#10163b;
  border:none;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  color:white;
}

button.primary{
  background:var(--accent);
  border:none;
  padding:12px 22px;
  border-radius:18px;
  font-weight:800;
  cursor:pointer;
  color:#000;
}

.hidden{display:none}

footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:6px;
}
</style>
</head>

<body>

<header>
  <div class="brand">ROOKIE <span>LEAGUE</span></div>
  <nav>
    <button class="active" onclick="show('live')">LIVE</button>
    <button onclick="show('champ')">CAMPEONATO</button>
    <button onclick="show('signup')">INSCRIÇÃO</button>
    <button onclick="show('login')">ADM</button>
  </nav>
  <div class="admin" id="adminStatus">Público</div>
</header>

<!-- LIVE -->
<div id="live" class="section active">
  <div class="leader">
    <div class="pos">P1</div>
    <div class="driver">
      <h1>#27 João Silva</h1>
      <small>BMW M4 GT3 • Best 1:32.451</small>
      <div class="tags">
        <span>MED</span>
        <span>Fuel 42%</span>
        <span>ERS 78%</span>
      </div>
      <div class="rpm"><div></div></div>
    </div>
    <div class="delta">
      <small>GAP</small>
      <strong>+0.000</strong>
    </div>
  </div>

  <div class="grid">
    <div class="table">
      <table>
        <thead>
          <tr><th>POS</th><th>PILOTO</th><th>SET</th><th>VOLTA</th><th>Δ</th></tr>
        </thead>
        <tbody>
          <tr class="lead"><td>P1</td><td>#27 João Silva</td><td>S1</td><td>1:32.451</td><td>—</td></tr>
          <tr><td>P2</td><td>#11 Lucas Rocha</td><td>S2</td><td>1:32.980</td><td>+0.529</td></tr>
          <tr><td>P3</td><td>#44 Pedro Lima</td><td>S3</td><td>1:33.102</td><td>+0.651</td></tr>
        </tbody>
      </table>
    </div>

    <div class="track">
      <svg viewBox="0 0 600 320">
        <path d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
        <path class="ideal" d="M80 160 Q160 40 320 60 Q500 80 520 160 Q540 260 360 280 Q200 300 120 240 Q60 200 80 160"/>
        <circle id="car" class="car" cx="80" cy="160" r="8"/>
      </svg>
    </div>
  </div>
</div>

<footer>Rookie League • Broadcast System</footer>

<script>
if(location.search.includes("overlay")){
  document.body.classList.add("overlay");
}

function show(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  event.target.classList.add("active");
}

let t=0;
setInterval(()=>{
  t+=0.02;
  car.setAttribute("cx",80+420*Math.abs(Math.sin(t)));
  car.setAttribute("cy",160+110*Math.sin(t*1.1));
},50);
</script>

</body>
</html>
