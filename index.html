<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2013 – Campeonato</title>
<style>
/* ====== GLOBAL ====== */
body{
    margin:0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:url('https://i.imgur.com/jZizpOi.png') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
}
header{
    background:linear-gradient(90deg,#111,#222);
    padding:10px 20px;
    border-bottom:4px solid #e10600;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h1{margin:0;font-size:1.6em}
nav{display:flex; align-items:center;}
nav button, nav .tablink{
    background:#111;
    border:none;
    padding:8px 12px;
    color:#fff;
    margin-left:5px;
    cursor:pointer;
}
nav button:hover, nav .tablink:hover{background:#e10600}
nav .active{background:#e10600}
main{padding:10px}

/* ====== TABELA PILOTOS F1 MODERNA ====== */
#tabelaSec {
    height: calc(100vh - 60px);
    overflow-y: auto;
}
#tabela {
    width:100%;
    border-collapse: collapse;
}
#tabela thead th {
    color:#e10600;
    font-size:0.95em;
    text-transform:uppercase;
    border-bottom:2px solid #fff;
    padding:10px;
    position: sticky;
    top: 0;
    background:rgba(0,0,0,0.85);
    z-index: 1;
}
#tabela tbody td {
    padding:10px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,0.2);
    font-size:0.9em;
    transition: background 0.3s, transform 0.3s;
}
#tabela tbody tr:hover:not(.lider){
    background:rgba(225,6,0,0.15);
    transform:scale(1.02);
}
.lider {
    background: linear-gradient(90deg,#e10600,#ff4c4c);
    color: #fff;
    font-weight:bold;
    font-size:1.15em;
    position: relative;
    overflow: hidden;
    animation: pulseGlow 1.5s infinite;
    box-shadow: 0 0 20px rgba(225,6,0,0.8),0 0 40px rgba(255,76,76,0.6);
    border-radius:6px;
}
@keyframes pulseGlow{
    0%{box-shadow:0 0 15px rgba(225,6,0,0.8),0 0 30px rgba(255,76,76,0.6);}
    50%{box-shadow:0 0 25px rgba(225,6,0,1),0 0 50px rgba(255,76,76,1);}
    100%{box-shadow:0 0 15px rgba(225,6,0,0.8),0 0 30px rgba(255,76,76,0.6);}
}

/* ====== CALENDÁRIO PUBLICO ====== */
#calendarioBody tr td{padding:8px;text-align:center;cursor:pointer;}
.hidden{display:none}

/* ====== MAPA DA PISTA ESTILO F1 TV ====== */
#mapContainer{
    position: relative;
    width: 100%;
    max-width: 900px;
    margin: 15px auto;
    border: 5px solid #e10600;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(225,6,0,0.8), 0 0 50px rgba(255,76,76,0.6);
    overflow: hidden;
    animation: glowPulse 2s infinite alternate;
    transition: transform 0.5s;
}
#pistaMap{
    width: 100%;
    display:block;
    border-radius: 10px;
    object-fit: contain;
    animation: fadeInMap 0.7s ease-in-out;
}
#mapInfo{
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1.05em;
    text-shadow: 0 0 5px #000;
}
#leaderMarker{
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #ffd700;
    border: 2px solid #fff;
    top: 10px;
    right: 10px;
    box-shadow: 0 0 15px #ffd700;
    display:none;
    animation: pulseLeader 1.5s infinite;
}
@keyframes fadeInMap{
    0%{opacity:0; transform: scale(0.95);}
    100%{opacity:1; transform: scale(1);}
}
@keyframes pulseLeader{
    0%{transform: scale(1); box-shadow:0 0 10px #ffd700;}
    50%{transform: scale(1.2); box-shadow:0 0 20px #ffd700;}
    100%{transform: scale(1); box-shadow:0 0 10px #ffd700;}
}

/* ====== LOGIN ====== */
.login-box{
    max-width:350px;
    margin:60px auto;
    background:rgba(0,0,0,0.9);
    padding:20px;
    border-radius:6px;
}
.login-box input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#222;
    border:1px solid #444;
    color:#fff;
}
.login-box button{
    width:100%;
    margin-top:15px;
    padding:10px;
    background:#e10600;
    border:none;
    color:#fff;
    font-weight:bold;
}

/* ====== ABAS ADMIN ====== */
.tabs{display:flex;margin-bottom:10px; flex-wrap:wrap;}
.tabs button{
    flex:1;
    background:#111;
    border:none;
    padding:10px;
    color:#fff;
    margin:2px 0;
}
.tabs button.active{background:#e10600}
.tabcontent{display:none;}
.tabcontent.active{display:block;}
input, button{font-size:0.9em;}
</style>
</head>

<body>
<header>
<h1>F1 2013 – Campeonato</h1>
<nav>
<button class="tablink active" onclick="openPublicTab('tabelaSec')">Tabela</button>
<button class="tablink" onclick="openPublicTab('calendarioSec')">Calendário</button>
<button onclick="mostrarLogin()">Área do Administrador</button>
</nav>
</header>

<main>
<!-- ====== PUBLICO ====== -->
<section id="tabelaSec">
<h2>Tabela do Campeonato</h2>
<table id="tabela">
<thead>
<tr><th>Pos</th><th>Piloto</th><th>Equipe</th><th>Pontos</th><th>Vitórias</th></tr>
</thead>
<tbody></tbody>
</table>
</section>

<section id="calendarioSec" class="hidden">
<h2>Calendário</h2>
<table>
<thead>
<tr><th>Etapa</th><th>Pista</th><th>Data</th><th>Status</th></tr>
</thead>
<tbody id="calendarioBody"></tbody>
</table>

<div id="mapContainer">
    <img id="pistaMap" src="" alt="Mapa da Pista">
    <div id="mapInfo">
        <span id="mapEtapa"></span> - <span id="mapPista"></span> | <span id="mapStatus"></span>
    </div>
    <div id="leaderMarker" title="Líder"></div>
</div>
</section>

<!-- ====== LOGIN ====== -->
<div id="login" class="login-box hidden">
<h2>Login Administrador</h2>
<input type="text" id="user" placeholder="Usuário">
<input type="password" id="pass" placeholder="Senha">
<button onclick="login()">Entrar</button>
<p id="erro" style="color:#ff5555"></p>
</div>

<!-- ====== ADMIN ====== -->
<section id="admin" class="hidden">
<h2>Painel Administrativo</h2>
<div class="tabs">
<button class="tablink active" onclick="openTab('entry')">Entry List</button>
<button class="tablink" onclick="openTab('calendarioAdmin')">Calendário</button>
<button class="tablink" onclick="openTab('resultados')">Resultados</button>
</div>

<div id="entry" class="tabcontent active">
<input type="file" id="uploadEntryList" accept=".csv">
<button onclick="processarEntryListCSV()">Upload Entry List</button>
</div>

<div id="calendarioAdmin" class="tabcontent hidden">
<h3>Adicionar etapa</h3>
<input type="number" id="etapaInput" placeholder="Etapa" style="width:60px">
<input type="text" id="pistaInput" placeholder="Nome da Pista">
<input type="date" id="dataInput">
<input type="file" id="imgPistaInput" accept=".png">
<button onclick="adicionarEtapa()">Adicionar Etapa</button>
</div>

<div id="resultados" class="tabcontent hidden">
<select id="corridaSelecionada"></select>
<input type="file" id="uploadArquivo" accept=".csv,.json">
<button onclick="processarResultados()">Upload Resultados</button>
</div>
</section>

<script>
// ====== PUBLICO ======
function openPublicTab(tab){
    document.querySelectorAll('#tabelaSec,#calendarioSec').forEach(s=>s.classList.add('hidden'));
    document.getElementById(tab).classList.remove('hidden');
    document.querySelectorAll('header .tablink').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
}

// ====== LOGIN ======
const USER="samuel", PASS="3636";
function mostrarLogin(){ document.getElementById("login").classList.toggle("hidden"); }
function login(){
    if(user.value===USER && pass.value===PASS){
        loginBox(true);
    }else erro.innerText="Login inválido";
}
function loginBox(ok){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("admin").classList.remove("hidden");
}

// ====== DADOS ======
const pontos=[25,18,15,12,10,8,6,4,2,1];
let pilotos = JSON.parse(localStorage.getItem('f1_2013_pilotos')) || [];
let calendario = JSON.parse(localStorage.getItem('f1_2013_calendario')) || [];
const selectCorrida=document.getElementById("corridaSelecionada");
const pistaMap=document.getElementById("pistaMap");
const mapEtapa=document.getElementById("mapEtapa");
const mapPista=document.getElementById("mapPista");
const mapStatus=document.getElementById("mapStatus");
const leaderMarker=document.getElementById("leaderMarker");
const mapContainer=document.getElementById("mapContainer");

// ====== PUBLICO ======
function atualizarTabela(){
    const tbody=document.querySelector("#tabela tbody");
    tbody.innerHTML="";
    pilotos.sort((a,b)=>b.pontos-a.pontos);
    pilotos.forEach((p,i)=>{
        const tr=document.createElement("tr");
        tr.className = i===0 ? "lider" : "";
        tr.innerHTML=`<td>${i+1}</td><td>${p.nome}</td><td>${p.equipe}</td><td>${p.pontos}</td><td>${p.vit}</td>`;
        tbody.appendChild(tr);
    });
}

function atualizarCalendario(){
    const body=document.getElementById("calendarioBody");
    body.innerHTML="";
    calendario.forEach((c,i)=>{
        body.innerHTML+=`<tr onclick="mostrarMapa(${i})"><td>${c.etapa}</td><td>${c.pista}</td><td>${c.data}</td><td>${c.status}</td></tr>`;
    });
}

function mostrarMapa(index){
    const c = calendario[index];
    if(c){
        pistaMap.src = c.imgBase64 || "";
        mapEtapa.innerText = `Etapa ${c.etapa}`;
        mapPista.innerText = c.pista;
        mapStatus.innerText = c.status;

        if(pilotos[0] && c.status==="Realizada"){
            leaderMarker.style.display="block";
            leaderMarker.title = `Líder: ${pilotos[0].nome}`;
        }else leaderMarker.style.display="none";

        mapContainer.style.transform = "scale(0.97)";
        setTimeout(()=>{mapContainer.style.transform="scale(1)";},100);
    } else {
        pistaMap.src=""; mapEtapa.innerText=""; mapPista.innerText=""; mapStatus.innerText=""; leaderMarker.style.display="none";
    }
}

// ====== ADMIN ======
function openTab(tab){
    document.querySelectorAll(".tabcontent").forEach(t=>t.classList.remove("active"));
    document.getElementById(tab).classList.add("active");
    document.querySelectorAll("#admin .tablink").forEach(b=>b.classList.remove("active"));
    event.target.classList.add("active");
}

function salvarDados(){
    localStorage.setItem('f1_2013_pilotos', JSON.stringify(pilotos));
    localStorage.setItem('f1_2013_calendario', JSON.stringify(calendario));
}

// Entry list
function processarEntryListCSV(){
    const f=uploadEntryList.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=e=>{
        pilotos=[];
        e.target.result.split("\n").forEach(l=>{
            const [nome,equipe]=l.split(",");
            if(nome)pilotos.push({nome:nome.trim(),equipe:equipe||"",pontos:0,vit:0});
        });
        salvarDados(); atualizarTabela(); alert("Entry List carregada");
    };
    r.readAsText(f);
}

// Calendário admin
function adicionarEtapa(){
    const etapa = Number(etapaInput.value);
    const pista = pistaInput.value.trim();
    const data = dataInput.value;
    const imgFile = imgPistaInput.files[0];
    if(!etapa || !pista || !data){ alert("Preencha todos os campos"); return;}
    if(imgFile){
        const reader = new FileReader();
        reader.onload = function(e){
            calendario.push({etapa,pista,data,status:"Pendente",imgBase64:e.target.result});
            salvarDados(); atualizarCalendario();
            alert("Etapa adicionada com imagem");
            etapaInput.value=""; pistaInput.value=""; dataInput.value=""; imgPistaInput.value="";
        };
        reader.readAsDataURL(imgFile);
    } else {
        calendario.push({etapa,pista,data,status:"Pendente"});
        salvarDados(); atualizarCalendario();
        alert("Etapa adicionada sem imagem");
        etapaInput.value=""; pistaInput.value=""; dataInput.value=""; imgPistaInput.value="";
    }
}

// Resultados
function processarResultados(){
    const f=uploadArquivo.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=e=>{
        e.target.result.split("\n").forEach((l,i)=>{
            const [nome]=l.split(",");
            const p=pilotos.find(x=>x.nome===nome);
            if(p){ p.pontos+=pontos[i]||0; if(i===0)p.vit++; }
        });
        if(selectCorrida.selectedIndex>=0) calendario[selectCorrida.selectedIndex].status="Realizada";
        salvarDados(); atualizarTabela(); atualizarCalendario();
        alert("Resultados aplicados");
    };
    r.readAsText(f);
}

// Inicializa
atualizarTabela(); atualizarCalendario();
</script>
</body>
</html>
