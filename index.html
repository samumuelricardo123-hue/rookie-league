<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Ferrari Display Horizontal</title>
<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.dashboard {
    display: grid;
    grid-template-areas:
        "rpm rpm rpm"
        "speed gear lap"
        "tires systems delta";
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    width: 100%;
    padding: 10px;
    text-align: center;
}

/* RPM LEDs em arco */
.rpm-container {
    grid-area: rpm;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
}
.led-rpm {
    width: 18px;
    height: 18px;
    margin: 2px;
    background: #111;
    border-radius: 50%;
    transition: background 0.1s, box-shadow 0.1s;
}
.led-rpm.green.on { background: #0f0; box-shadow: 0 0 5px #0f0; }
.led-rpm.yellow.on { background: #ff0; box-shadow: 0 0 8px #ff0; }
.led-rpm.red.on { background: #f00; box-shadow: 0 0 10px #f00; }

/* Speed */
.speed-container {
    grid-area: speed;
}
.speed-container h1 {
    font-size: 4em;
    color: #ff0;
    text-shadow: 0 0 10px #ff0;
}

/* Gear */
.gear-container {
    grid-area: gear;
}
.gear-display {
    font-size: 3em;
    color: #ff0;
    font-weight: bold;
    text-shadow: 0 0 15px #ff0;
}

/* Lap */
.lap-container {
    grid-area: lap;
    font-size: 1.5em;
    color: #0ff;
}

/* Tires */
.tires-container {
    grid-area: tires;
    display: flex;
    justify-content: space-around;
    font-size: 1em;
}
.tire {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Systems */
.systems {
    grid-area: systems;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 1.2em;
}
.drs {
    width: 50px;
    height: 25px;
    background: #333;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
    transition: background 0.2s, color 0.2s;
}
.drs.on { background: #ff0; color: #000; box-shadow: 0 0 10px #ff0; }

.ers-container {
    width: 120px;
    height: 20px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}
.ers-bar {
    height: 100%;
    width: 0%;
    background: #f00;
    transition: width 0.2s;
    box-shadow: 0 0 5px #f00;
}

/* Delta */
.delta-container {
    grid-area: delta;
    font-size: 1.2em;
    color: #f00;
}

/* Fullscreen */
.fullscreen-btn {
    position: fixed;
    top: 10px;
    right: 10px;
    background: #222;
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
}
</style>
</head>
<body>

<button class="fullscreen-btn" id="fullscreen-btn">Tela Cheia</button>

<div class="dashboard">

  <!-- RPM LEDs -->
  <div class="rpm-container" id="rpm-container">
    <!-- 20 LEDs -->
    <div class="led-rpm green" id="led0"></div>
    <div class="led-rpm green" id="led1"></div>
    <div class="led-rpm green" id="led2"></div>
    <div class="led-rpm green" id="led3"></div>
    <div class="led-rpm green" id="led4"></div>
    <div class="led-rpm yellow" id="led5"></div>
    <div class="led-rpm yellow" id="led6"></div>
    <div class="led-rpm yellow" id="led7"></div>
    <div class="led-rpm yellow" id="led8"></div>
    <div class="led-rpm yellow" id="led9"></div>
    <div class="led-rpm red" id="led10"></div>
    <div class="led-rpm red" id="led11"></div>
    <div class="led-rpm red" id="led12"></div>
    <div class="led-rpm red" id="led13"></div>
    <div class="led-rpm red" id="led14"></div>
    <div class="led-rpm red" id="led15"></div>
    <div class="led-rpm red" id="led16"></div>
    <div class="led-rpm red" id="led17"></div>
    <div class="led-rpm red" id="led18"></div>
    <div class="led-rpm red" id="led19"></div>
  </div>

  <!-- Speed -->
  <div class="speed-container">
    <h1 id="speed">0</h1>
  </div>

  <!-- Gear -->
  <div class="gear-container">
    <div class="gear-display" id="gear">N</div>
  </div>

  <!-- Lap -->
  <div class="lap-container" id="lap">Volta: 0</div>

  <!-- Tires -->
  <div class="tires-container">
    <div class="tire">
      <div>FL</div>
      <div id="tireFL">0°C</div>
    </div>
    <div class="tire">
      <div>FR</div>
      <div id="tireFR">0°C</div>
    </div>
    <div class="tire">
      <div>RL</div>
      <div id="tireRL">0°C</div>
    </div>
    <div class="tire">
      <div>RR</div>
      <div id="tireRR">0°C</div>
    </div>
  </div>

  <!-- Systems -->
  <div class="systems">
    <div class="drs" id="drs">DRS</div>
    <div class="ers-container">
      <div class="ers-bar" id="ers"></div>
    </div>
  </div>

  <!-- Delta -->
  <div class="delta-container" id="delta">+0.000</div>

</div>

<script>
// WebSocket
const ws = new WebSocket('ws://localhost:8080');

ws.onopen = () => console.log('Conectado ao WebSocket');

const leds = [];
for(let i=0;i<20;i++) leds.push(document.getElementById('led'+i));

ws.onmessage = (event)=>{
    const data = JSON.parse(event.data);

    document.getElementById('speed').innerText = data.speed;
    document.getElementById('gear').innerText = data.gear;
    document.getElementById('lap').innerText = `Volta: ${data.lap}`;
    document.getElementById('delta').innerText = data.delta;

    document.getElementById('tireFL').innerText = data.tires.FL+'°C';
    document.getElementById('tireFR').innerText = data.tires.FR+'°C';
    document.getElementById('tireRL').innerText = data.tires.RL+'°C';
    document.getElementById('tireRR').innerText = data.tires.RR+'°C';

    const rpmPercent = data.rpm / 22000;
    leds.forEach((led,i)=>led.classList.toggle('on', rpmPercent > i*0.05));

    const drsEl = document.getElementById('drs');
    drsEl.classList.toggle('on', data.drs);

    document.getElementById('ers').style.width = `${data.ers}%`;
};

// Fullscreen
const fsBtn = document.getElementById('fullscreen-btn');
fsBtn.addEventListener('click', ()=>{
    if(!document.fullscreenElement) document.querySelector('.dashboard').requestFullscreen();
    else document.exitFullscreen();
});
</script>
</body>
</html>
