<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Rookie League • Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#02040a;
  --glass:rgba(18,22,40,.75);
  --line:rgba(255,255,255,.08);
  --accent:#00f0ff;
  --gold:#ffd166;
  --green:#4dff88;
  --red:#ff4d4d;
  --text:#edf1ff;
  --muted:#8a94c7;
}

*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial,sans-serif}

body{
  margin:0;
  background:linear-gradient(180deg,#02040a,#05091a);
  color:var(--text);
}

/* ===== TOP ===== */
.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.logo{
  font-weight:900;
  letter-spacing:4px;
}
.logo span{color:var(--accent)}

nav{
  display:flex;
  gap:18px;
}

nav button{
  background:none;
  border:none;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
}

nav button.active{color:var(--accent)}

.admin-status{
  font-size:12px;
  color:var(--muted);
}

/* ===== SECTIONS ===== */
.section{
  display:none;
  padding:26px;
}

.section.active{display:block}

/* ===== BOX ===== */
.box{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  max-width:900px;
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

th{color:var(--muted)}

/* ===== FORM ===== */
input,select{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:none;
  background:#101634;
  color:white;
  margin-bottom:12px;
}

button.primary{
  background:var(--accent);
  border:none;
  padding:10px 18px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
  color:#000;
}

button.danger{
  background:var(--red);
  border:none;
  padding:6px 12px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

.hidden{display:none}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">ROOKIE <span>LEAGUE</span></div>

  <nav>
    <button onclick="show('live')" class="active">Live</button>
    <button onclick="show('champ')">Campeonato</button>
    <button onclick="show('signup')">Inscrição</button>
    <button onclick="show('login')">ADM</button>
  </nav>

  <div class="admin-status" id="adminStatus">Visitante</div>
</div>

<!-- LIVE -->
<div id="live" class="section active">
  <div class="box">
    <h2>Live Timing</h2>
    <p>Modo TV / dados ao vivo (em breve)</p>
  </div>
</div>

<!-- CHAMPIONSHIP -->
<div id="champ" class="section">
  <div class="box">
    <h2>Campeonato</h2>

    <table>
      <thead>
        <tr>
          <th>POS</th>
          <th>PILOTO</th>
          <th>PONTOS</th>
          <th class="admin-only hidden">AÇÕES</th>
        </tr>
      </thead>
      <tbody id="champTable"></tbody>
    </table>

    <div class="admin-only hidden">
      <h3>Adicionar / Editar</h3>
      <input id="champName" placeholder="Nome do piloto">
      <input id="champPts" placeholder="Pontos">
      <button class="primary" onclick="addChamp()">Salvar</button>
    </div>
  </div>
</div>

<!-- SIGNUP -->
<div id="signup" class="section">
  <div class="box">
    <h2>Inscrição de Pilotos</h2>

    <input id="sName" placeholder="Nome do piloto">
    <input id="sCar" placeholder="Carro">
    <button class="primary" onclick="signup()">Enviar inscrição</button>

    <p style="color:var(--muted);font-size:13px">
      Sua inscrição será avaliada pelo administrador.
    </p>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="section">
  <div class="box">
    <h2>Login ADM</h2>

    <input id="user" placeholder="Usuário">
    <input id="pass" type="password" placeholder="Senha">
    <button class="primary" onclick="login()">Entrar</button>
  </div>
</div>

<script>
let isAdmin=false;
let champData=[
 {name:"João Silva",pts:52},
 {name:"Lucas Rocha",pts:44}
];

function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function renderChamp(){
  const tb=document.getElementById("champTable");
  tb.innerHTML="";
  champData
    .sort((a,b)=>b.pts-a.pts)
    .forEach((d,i)=>{
      tb.innerHTML+=`
        <tr>
          <td>P${i+1}</td>
          <td>${d.name}</td>
          <td>${d.pts}</td>
          ${isAdmin?`<td><button class="danger" onclick="delChamp(${i})">X</button></td>`:""}
        </tr>`;
    });
}

function addChamp(){
  champData.push({
    name:champName.value,
    pts:Number(champPts.value)
  });
  renderChamp();
}

function delChamp(i){
  champData.splice(i,1);
  renderChamp();
}

function signup(){
  alert("Inscrição enviada para o ADM!");
}

function login(){
  if(user.value==="ADM" && pass.value==="3636"){
    isAdmin=true;
    document.getElementById("adminStatus").innerText="Administrador";
    document.querySelectorAll(".admin-only").forEach(e=>e.classList.remove("hidden"));
    alert("Login realizado");
    renderChamp();
  }else{
    alert("Login inválido");
  }
}

renderChamp();
</script>

</body>
</html>
