<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Assetto Corsa Server Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg-main: #121212;
  --bg-sidebar: #181818;
  --bg-panel: #1f1f1f;
  --bg-row: #252525;
  --border: #2c2c2c;
  --text-main: #d6d6d6;
  --text-muted: #9a9a9a;
  --accent: #3fa34d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, sans-serif;
  font-size: 12px;
  background: var(--bg-main);
  color: var(--text-main);
}

/* ===== LAYOUT ===== */
.app {
  display: flex;
  height: 100vh;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 210px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
}

.sidebar h2 {
  margin: 0;
  padding: 12px;
  font-size: 13px;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
}

.menu button {
  width: 100%;
  padding: 10px 14px;
  background: none;
  border: none;
  color: var(--text-muted);
  text-align: left;
  cursor: pointer;
}

.menu button.active,
.menu button:hover {
  background: #242424;
  color: var(--text-main);
}

/* ===== MAIN ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}
