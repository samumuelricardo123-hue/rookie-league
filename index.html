<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2013 - Admin</title>

<style>
body{
    margin:0;
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:url('https://i.imgur.com/jZizpOi.png') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
}
header{
    background:linear-gradient(90deg,#111,#222);
    padding:15px 20px;
    border-bottom:4px solid #e10600;
}
header h1{margin:0;font-size:1.8em;letter-spacing:1px}
main{padding:20px}
h2{color:#e10600}
.login-box{
    max-width:350px;
    margin:100px auto;
    background:rgba(0,0,0,0.8);
    padding:20px;
    border-radius:6px;
    box-shadow:0 0 20px #000;
}
.login-box input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#222;
    border:1px solid #444;
    color:#fff;
}
button{
    margin-top:15px;
    width:100%;
    padding:10px;
    background:#e10600;
    border:none;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
button:hover{background:#c00400}

.tabs{display:flex;margin-bottom:20px}
.tabs button{
    flex:1;
    background:#111;
    border:none;
    padding:10px;
    color:#fff;
}
.tabs button.active{background:#e10600}

.tabcontent{display:none}
input[type="file"], select{
    margin-top:10px;
    background:#222;
    color:#fff;
    border:1px solid #444;
    padding:6px;
    width:100%;
}

footer{
    position:fixed;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.7);
    text-align:center;
    padding:8px;
    color:#888;
}
</style>
</head>

<body>

<header>
<h1>F1 2013 – Painel Administrativo</h1>
</header>

<!-- LOGIN -->
<div id="login" class="login-box">
<h2>Login Admin</h2>
<input type="text" id="user" placeholder="Usuário">
<input type="password" id="pass" placeholder="Senha">
<button onclick="login()">Entrar</button>
<p id="erro" style="color:#ff5555"></p>
</div>

<!-- PAINEL ADMIN -->
<main id="admin" style="display:none">

<div class="tabs">
<button class="tablink active" onclick="openTab('entry')">Entry List</button>
<button class="tablink" onclick="openTab('pistas')">Pistas</button>
<button class="tablink" onclick="openTab('resultados')">Resultados</button>
</div>

<div id="entry" class="tabcontent" style="display:block">
<h2>Upload Entry List (.csv)</h2>
<input type="file" id="uploadEntryList" accept=".csv">
<button onclick="processarEntryListCSV()">Carregar Pilotos</button>
<p>Formato: nome,equipe,numero,skin</p>
</div>

<div id="pistas" class="tabcontent">
<h2>Upload de Pistas</h2>
<input type="file" id="uploadPistas" accept=".csv,.json">
<button onclick="processarPistas()">Carregar Pistas</button>
<p>CSV: etapa,pista,data</p>
</div>

<div id="resultados" class="tabcontent">
<h2>Upload de Resultados</h2>
<select id="corridaSelecionada"></select>
<input type="file" id="uploadArquivo" accept=".csv,.json">
<button onclick="processarArquivo()">Aplicar Resultados</button>
</div>

</main>

<footer>F1 2013 – Assetto Corsa</footer>

<script>
// ================= LOGIN =================
const USER = "samuel";
const PASS = "3636";

function login(){
    const u=document.getElementById("user").value;
    const p=document.getElementById("pass").value;
    if(u===USER && p===PASS){
        document.getElementById("login").style.display="none";
        document.getElementById("admin").style.display="block";
    }else{
        document.getElementById("erro").innerText="Usuário ou senha inválidos";
    }
}

// ================= TABS =================
function openTab(tab){
    document.querySelectorAll('.tabcontent').forEach(t=>t.style.display="none");
    document.querySelectorAll('.tablink').forEach(b=>b.classList.remove("active"));
    document.getElementById(tab).style.display="block";
    event.target.classList.add("active");
}

// ================= DADOS =================
const pontosPorPosicao=[25,18,15,12,10,8,6,4,2,1];
let pilotos=[];
let calendario=[];
const selectCorrida=document.getElementById("corridaSelecionada");

// ================= ENTRY LIST =================
function processarEntryListCSV(){
    const file=document.getElementById("uploadEntryList").files[0];
    if(!file){alert("Selecione o CSV");return;}
    const r=new FileReader();
    r.onload=e=>{
        pilotos=[];
        e.target.result.split("\n").forEach((l,i)=>{
            const [nome,equipe]=l.split(",");
            if(nome){
                pilotos.push({nome:nome.trim(),equipe:equipe||"",pontos:0,vit:0});
            }
        });
        alert("Entry List carregada!");
    };
    r.readAsText(file);
}

// ================= PISTAS =================
function processarPistas(){
    const file=document.getElementById("uploadPistas").files[0];
    if(!file){alert("Selecione arquivo");return;}
    const r=new FileReader();
    r.onload=e=>{
        calendario=[];
        e.target.result.split("\n").forEach(l=>{
            const [etapa,pista,data]=l.split(",");
            if(etapa&&pista){
                calendario.push({etapa,pista,data,status:"Pendente"});
            }
        });
        atualizarSelect();
        alert("Pistas carregadas!");
    };
    r.readAsText(file);
}

function atualizarSelect(){
    selectCorrida.innerHTML="";
    calendario.forEach(c=>{
        const o=document.createElement("option");
        o.text=`Etapa ${c.etapa} - ${c.pista}`;
        selectCorrida.appendChild(o);
    });
}

// ================= RESULTADOS =================
function processarArquivo(){
    const file=document.getElementById("uploadArquivo").files[0];
    if(!file){alert("Selecione arquivo");return;}
    const r=new FileReader();
    r.onload=e=>{
        e.target.result.split("\n").forEach((l,i)=>{
            const [nome]=l.split(",");
            const p=pilotos.find(p=>p.nome===nome);
            if(p){
                p.pontos+=pontosPorPosicao[i]||0;
                if(i===0)p.vit++;
            }
        });
        alert("Resultados aplicados!");
    };
    r.readAsText(file);
}
</script>

</body>
</html>
