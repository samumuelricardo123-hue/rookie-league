<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Dashboard Marcha Central</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
}

.dashboard {
    display: grid;
    grid-template-rows: auto 1fr auto;
    width: 100%;
    height: 100%;
}

/* Top: RPM LEDs */
.rpm-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1vh 2vw;
    flex-wrap: nowrap;
    overflow: hidden;
}
.led-rpm {
    border-radius: 50%;
    background: #111;
    transition: all 0.1s;
}
.led-rpm.green.on { background: #0f0; box-shadow: 0 0 6px #0f0; }
.led-rpm.yellow.on { background: #ff0; box-shadow: 0 0 8px #ff0; }
.led-rpm.red.on { background: #f00; box-shadow: 0 0 10px #f00; }

/* Middle: Marcha e Velocidade */
.middle-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1vh;
}
.gear-display {
    font-size: 20vw;
    font-weight: bold;
    text-shadow: 0 0 20px #ff0;
    color: #ff0;
}
.speed-container {
    font-size: 12vw;
    font-weight: bold;
    color: #ff0;
    text-shadow: 0 0 15px #ff0, 0 0 30px #ff0;
}

/* Bottom: Tires, Systems, Lap/Delta */
.bottom-section {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 1vh 2vw;
    gap: 2vw;
}

/* Tires */
.tires-container {
    display: flex;
    gap: 2vw;
}
.tire { display: flex; flex-direction: column; align-items: center; font-weight: bold; }
.tire span { margin-top: 0.2em; }

/* Systems */
.systems {
    display: flex;
    align-items: center;
    gap: 2vw;
}
.drs {
    width: 8vw;
    height: 3vh;
    background: #333;
    border-radius: 4px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
    transition: all 0.2s;
}
.drs.on { background: #ff0; color: #000; box-shadow: 0 0 10px #ff0; animation: blink 1s infinite; }
@keyframes blink { 0%,50%,100%{opacity:1} 25%,75%{opacity:0.4} }
.ers-container {
    width: 20vw;
    height: 3vh;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}
.ers-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(to right, #0f0,#ff0,#f00);
    box-shadow: 0 0 8px #f00;
    transition: width 0.2s;
}

/* Lap/Delta */
.lap-delta-container {
    display: flex;
    flex-direction: column;
    gap: 0.5vh;
    text-align: right;
}
.lap-container, .delta-container {
    font-weight: bold;
    padding: 0.3vh 0.5vw;
    border-radius: 5px;
    background: rgba(255,255,255,0.05);
}
.lap-container { color: #0ff; }
.delta-container { color: #f00; }

/* Fullscreen */
.fullscreen-btn {
    position: fixed;
    top: 1vh;
    right: 1vw;
    background: #222;
    color: #fff;
    border: none;
    padding: 1vh 1vw;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 1000;
}
</style>
</head>
<body>

<button class="fullscreen-btn" id="fullscreen-btn">Tela Cheia</button>

<div class="dashboard">

  <!-- Top: RPM LEDs -->
  <div class="rpm-container" id="rpm-container">
    <div class="led-rpm green" id="led0"></div>
    <div class="led-rpm green" id="led1"></div>
    <div class="led-rpm green" id="led2"></div>
    <div class="led-rpm green" id="led3"></div>
    <div class="led-rpm green" id="led4"></div>
    <div class="led-rpm yellow" id="led5"></div>
    <div class="led-rpm yellow" id="led6"></div>
    <div class="led-rpm yellow" id="led7"></div>
    <div class="led-rpm yellow" id="led8"></div>
    <div class="led-rpm yellow" id="led9"></div>
    <div class="led-rpm red" id="led10"></div>
    <div class="led-rpm red" id="led11"></div>
    <div class="led-rpm red" id="led12"></div>
    <div class="led-rpm red" id="led13"></div>
    <div class="led-rpm red" id="led14"></div>
    <div class="led-rpm red" id="led15"></div>
    <div class="led-rpm red" id="led16"></div>
    <div class="led-rpm red" id="led17"></div>
    <div class="led-rpm red" id="led18"></div>
    <div class="led-rpm red" id="led19"></div>
  </div>

  <!-- Middle: Marcha e Velocidade -->
  <div class="middle-section">
    <div class="gear-display" id="gear">N</div>
    <div class="speed-container" id="speed">0</div>
  </div>

  <!-- Bottom: Tires, Systems, Lap/Delta -->
  <div class="bottom-section">
    <div class="tires-container">
      <div class="tire">FL <span id="tireFL">0°C</span></div>
      <div class="tire">FR <span id="tireFR">0°C</span></div>
      <div class="tire">RL <span id="tireRL">0°C</span></div>
      <div class="tire">RR <span id="tireRR">0°C</span></div>
    </div>
    <div class="systems">
      <div class="drs" id="drs">DRS</div>
      <div class="ers-container"><div class="ers-bar" id="ers"></div></div>
    </div>
    <div class="lap-delta-container">
      <div class="lap-container" id="lap">Volta: 0</div>
      <div class="delta-container" id="delta">+0.000</div>
    </div>
  </div>

</div>

<script>
// WebSocket exemplo
const ws = new WebSocket('ws://localhost:8080');
ws.onopen = ()=>console.log('Conectado');

const leds = [];
for(let i=0;i<20;i++) leds.push(document.getElementById('led'+i));

ws.onmessage = (event)=>{
    const data = JSON.parse(event.data);
    document.getElementById('gear').innerText = data.gear;
    document.getElementById('speed').innerText = data.speed;
    document.getElementById('lap').innerText = `Volta: ${data.lap}`;
    document.getElementById('delta').innerText = data.delta;

    ['FL','FR','RL','RR'].forEach(t=>{
        const el = document.getElementById('tire'+t);
        el.innerText = data.tires[t]+'°C';
        el.style.color = data.tires[t]<70?'#0f0':data.tires[t]<100?'#ff0':'#f00';
    });

    const rpmPercent = data.rpm/22000;
    leds.forEach((led,i)=>led.classList.toggle('on', rpmPercent > i*0.05));

    document.getElementById('drs').classList.toggle('on', data.drs);
    document.getElementById('ers').style.width = `${data.ers}%`;
};

// Fullscreen
document.getElementById('fullscreen-btn').addEventListener('click', ()=>{
    const dash = document.querySelector('.dashboard');
    if(!document.fullscreenElement) dash.requestFullscreen();
    else document.exitFullscreen();
});

// Responsividade LEDs e fontes
function resizeDashboard(){
    const w = window.innerWidth;
    const h = window.innerHeight;
    const ledSize = Math.max(Math.min(w/25, h/25), 10);
    leds.forEach(led=>{
        led.style.width = `${ledSize}px`;
        led.style.height = `${ledSize}px`;
    });

    document.getElementById('gear').style.fontSize = `${Math.max(w,h)/4}px`;
    document.getElementById('speed').style.fontSize = `${Math.max(w,h)/7}px`;
    document.getElementById('lap').style.fontSize = `${Math.max(w,h)/30}px`;
    document.getElementById('delta').style.fontSize = `${Math.max(w,h)/30}px`;
}
window.addEventListener('resize', resizeDashboard);
resizeDashboard();
</script>
</body>
</html>
