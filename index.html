<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2013 – Campeonato</title>
<style>
/* Estilos (mesmos de antes — tabela moderna, mapa com fundo preto, etc.) */
body{margin:0;font-family:'Helvetica Neue',Arial,sans-serif;background:#000;color:#fff;}
header{background:linear-gradient(90deg,#111,#222);padding:10px 20px;border-bottom:4px solid #e10600;display:flex;justify-content:space-between;align-items:center;}
header h1{margin:0;font-size:1.6em;}
nav{display:flex;align-items:center;}
nav button, nav .tablink{background:#111;border:none;padding:8px 12px;color:#fff;margin-left:5px;cursor:pointer;}
nav button:hover, nav .tablink:hover{background:#e10600;}
nav .active{background:#e10600;}
main{padding:10px;}
/* Tabela */
#tabelaSec{height:calc(100vh - 60px);overflow-y:auto;}
#tabela{width:100%;border-collapse:collapse;}
#tabela thead th{color:#e10600;font-size:0.95em;text-transform:uppercase;border-bottom:2px solid #fff;padding:10px;position:sticky;top:0;background:rgba(0,0,0,0.85);z-index:1;}
#tabela tbody td{padding:10px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.2);font-size:0.9em;}
.lider{background: linear-gradient(90deg,#e10600,#ff4c4c);color:#fff;font-weight:bold;font-size:1.15em;}
/* Calendário */
#calendarioBody tr td{padding:8px;text-align:center;}
#mapContainer{position:relative;width:100%;max-width:900px;margin:15px auto;background:#000;border:5px solid #e10600;border-radius:12px;box-shadow:0 0 25px rgba(225,6,0,0.8);overflow:hidden;}
#pistaMap{width:100%;display:block;border-radius:10px;object-fit:contain;}
#mapInfo{position:absolute;top:15px;left:15px;background:#000;color:#fff;padding:10px 15px;border-radius:8px;font-weight:bold;font-size:1.05em;}
</style>
</head>
<body>

<header>
<h1>F1 2013 – Campeonato</h1>
<nav>
<button class="tablink active" onclick="openPublicTab('tabelaSec',this)">Tabela</button>
<button class="tablink" onclick="openPublicTab('calendarioSec',this)">Calendário</button>
<button onclick="mostrarLogin()">Área do Admin</button>
</nav>
</header>

<main>
<section id="tabelaSec">
<h2>Tabela do Campeonato</h2>
<table id="tabela">
<thead><tr><th>Pos</th><th>Piloto</th><th>Equipe</th><th>Pontos</th><th>Vitórias</th></tr></thead>
<tbody></tbody>
</table>
</section>

<section id="calendarioSec" class="hidden">
<h2>Calendário</h2>
<table>
<thead><tr><th>Etapa</th><th>Pista</th><th>Data</th><th>Status</th></tr></thead>
<tbody id="calendarioBody"></tbody>
</table>
<div id="mapContainer">
<img id="pistaMap" src="" alt="Mapa da Pista">
<div id="mapInfo"><span id="mapEtapa"></span> - <span id="mapPista"></span> | <span id="mapStatus"></span></div>
</div>
</section>

<div id="login" class="login-box hidden">
<h2>Login Administrador</h2>
<input type="text" id="user" placeholder="Usuário">
<input type="password" id="pass" placeholder="Senha">
<button onclick="loginAdmin()">Entrar</button>
<p id="erro" style="color:#f55"></p>
</div>

<section id="admin" class="hidden">
<h2>Painel Administrativo</h2>

<div class="tabs">
<button class="tablink active" onclick="openAdminTab('entry',this)">Entry List</button>
<button class="tablink" onclick="openAdminTab('calendarioAdmin',this)">Calendário</button>
<button class="tablink" onclick="openAdminTab('resultados',this)">Resultados</button>
</div>

<div id="entry" class="tabcontent active">
<input type="file" id="uploadEntryList" accept=".csv">
<button onclick="processEntryList()">Upload Entry List</button>
</div>

<div id="calendarioAdmin" class="tabcontent hidden">
<h3>Adicionar etapa</h3>
<input type="number" id="etapaInput" placeholder="Etapa">
<input type="text" id="pistaInput" placeholder="Nome da Pista">
<input type="date" id="dataInput">
<input type="file" id="imgPistaInput" accept=".png">
<button onclick="addEtapa()">Adicionar Etapa</button>
</div>

<div id="resultados" class="tabcontent hidden">
<select id="corridaSelecionada"></select>
<input type="file" id="uploadArquivo" accept=".csv,.json">
<button onclick="processarResultados()">Upload Resultados</button>
</div>

</section>
</main>

<script>

// — GitHub Config — 
const OWNER = "samumuelricardo123-hue";
const REPO  = "rookie‑league";
const PATH_DATA = "f1_2013_data.json";
const GITHUB_TOKEN = "SEU_TOKEN_AQUI"; // 👈 Substitua aqui

// — Dados — 
let pilotos = [];
let calendario = [];
const pontos = [25,18,15,12,10,8,6,4,2,1];

// DOM
const pistaMap = document.getElementById("pistaMap");
const mapEtapa = document.getElementById("mapEtapa");
const mapPista = document.getElementById("mapPista");
const mapStatus = document.getElementById("mapStatus");

// — Funções GitHub — 
async function githubFetch(){
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH_DATA}`, {
    headers: { Authorization:`token ${GITHUB_TOKEN}` }
  });
  if(!res.ok) return null;
  const data = await res.json();
  return JSON.parse(atob(data.content));
}

async function githubSave(data){
  const getFile = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH_DATA}`, {
    headers: { Authorization:`token ${GITHUB_TOKEN}` }
  });
  const sha = getFile.ok ? (await getFile.json()).sha : null;
  await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH_DATA}`, {
    method:"PUT",
    headers:{ Authorization:`token ${GITHUB_TOKEN}`, "Content-Type":"application/json" },
    body: JSON.stringify({
      message: "Atualizando dados F1 2013",
      content: btoa(JSON.stringify(data)),
      sha
    })
  });
}

// — Controle de abas —
function openPublicTab(tab,btn){
  document.querySelectorAll("#tabelaSec,#calendarioSec").forEach(s=>s.classList.add("hidden"));
  document.getElementById(tab).classList.remove("hidden");
  document.querySelectorAll("header .tablink").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

function openAdminTab(tab,btn){
  document.querySelectorAll("#admin .tabcontent").forEach(t=>t.classList.remove("active"));
  document.getElementById(tab).classList.add("active");
  document.querySelectorAll("#admin .tablink").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

// — Login admin —
function mostrarLogin(){ document.getElementById("login").classList.toggle("hidden"); }
function loginAdmin(){
  if(user.value==="samuel" && pass.value==="3636"){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("admin").classList.remove("hidden");
  } else erro.innerText="Login inválido";
}

// — Atualização visual —
function atualizarTabela(){
  const tbody = document.querySelector("#tabela tbody");
  tbody.innerHTML = "";
  pilotos.sort((a,b)=>b.pontos‑a.pontos);
  pilotos.forEach((p,i)=>tbody.innerHTML += `<tr class="${i===0?'lider':''}"><td>${i+1}</td><td>${p.nome}</td><td>${p.equipe}</td><td>${p.pontos}</td><td>${p.vit||0}</td></tr>`);
}

function atualizarCalendario(){
  const body = document.getElementById("calendarioBody");
  body.innerHTML = "";
  calendario.forEach((c,i) => body.innerHTML += `<tr><td>${c.etapa}</td><td>${c.pista}</td><td>${c.data}</td><td>${c.status}</td></tr>`);
  if(calendario.length) mostrarMapa(calendario.length‑1);
}

function mostrarMapa(index){
  const c = calendario[index];
  if(c){
    pistaMap.src=c.imgBase64||"";
    mapEtapa.innerText=`Etapa ${c.etapa}`; mapPista.innerText=c.pista; mapStatus.innerText=c.status;
  }
}

// — Admin actions —
function processEntryList(){
  const f=uploadEntryList.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=e=>{
    pilotos=[]; e.target.result.split("\n").forEach(l=>{
      const [nome,equipe]=l.split(",");
      if(nome) pilotos.push({nome:nome.trim(),equipe:equipe||"",pontos:0,vit:0});
    });
    githubSave({pilotos,calendario}); atualizarTabela();alert("Entry List carregada!");
  }; r.readAsText(f);
}

function addEtapa(){
  const e=Number(etapaInput.value), p=pistaInput.value.trim(), d=dataInput.value, img=imgPistaInput.files[0];
  if(!e||!p||!d){alert("Preencha todos os campos");return;}
  if(img){
    const r=new FileReader(); r.onload=ev=>{
      calendario.push({etapa:e,pista:p,data:d,status:"Pendente",imgBase64:ev.target.result});
      githubSave({pilotos,calendario}); atualizarCalendario(); alert("Etapa adicionada!");
    }; r.readAsDataURL(img);
  } else {
    calendario.push({etapa:e,pista:p,data:d,status:"Pendente"});
    githubSave({pilotos,calendario}); atualizarCalendario();
  }
}

function processarResultados(){
  const f=uploadArquivo.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=e=>{
    e.target.result.split("\n").forEach((l,i)=>{const [nome]=l.split(","); const p=pilotos.find(x=>x.nome===nome); if(p){p.pontos+=pontos[i]||0; if(i===0)p.vit=(p.vit||0)+1;}});
    if(corridaSelecionada.selectedIndex>=0) calendario[corridaSelecionada.selectedIndex].status="Realizada";
    githubSave({pilotos,calendario}); atualizarTabela(); atualizarCalendario(); alert("Resultados aplicados!");
  }; r.readAsText(f);
}

// — Start —
githubFetch().then(data=>{if(data){pilotos=data.pilotos||[]; calendario=data.calendario||[];} atualizarTabela(); atualizarCalendario();});
</script>

</body>
</html>
