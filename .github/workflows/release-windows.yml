name: Build and publish Rookie League for Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-app/package-lock.json

      - name: Install dependencies
        working-directory: windows-app
        run: npm ci

      - name: Build Windows installer and update packages
        working-directory: windows-app
        run: npm run make

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rookie League ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            windows-app/out/make/squirrel.windows/x64/*.exe
            windows-app/out/make/squirrel.windows/x64/*.nupkg
            windows-app/out/make/squirrel.windows/x64/RELEASES
